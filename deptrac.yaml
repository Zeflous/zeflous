deptrac:
  paths:
    - ./src
    # The CI gate engine's post-relocation home: deptrac keeps guarding
    # its layer discipline (Kernel/Exception/Container only) at the new
    # path, exactly as it did from src/.
    - ./tests/Support/Tooling
  exclude_files:
    # The vendored PSR shim is a zero-library boundary artifact, not a ZEF layer.
    - '#.*/Contracts/Psr/.*#'
  layers:
    - name: Exception
      collectors:
        - type: classNameRegex
          value: '#^Zef\\Framework\\Exception\\#'
    - name: Contracts
      collectors:
        - type: classNameRegex
          value: '#^Zef\\Framework\\Contracts\\#'
    - name: Container
      collectors:
        - type: classNameRegex
          value: '#^Zef\\Framework\\Container\\#'
    - name: Config
      collectors:
        - type: classNameRegex
          value: '#^Zef\\Framework\\Config\\#'
    - name: Router
      collectors:
        - type: classNameRegex
          value: '#^Zef\\Framework\\Router\\#'
    - name: Health
      collectors:
        - type: classNameRegex
          value: '#^Zef\\Framework\\Health\\#'
    - name: Telemetry
      collectors:
        - type: classNameRegex
          value: '#^Zef\\Framework\\Telemetry\\#'
    - name: Http
      collectors:
        - type: classNameRegex
          value: '#^Zef\\Framework\\Http\\#'
    - name: Message
      collectors:
        - type: classNameRegex
          value: '#^Zef\\Framework\\Message\\#'
    - name: Middleware
      collectors:
        - type: classNameRegex
          value: '#^Zef\\Framework\\Middleware\\#'
    - name: Export
      collectors:
        - type: classNameRegex
          value: '#^Zef\\Framework\\Export\\#'
    - name: Storage
      collectors:
        - type: classNameRegex
          value: '#^Zef\\Framework\\Storage\\#'
    - name: Event
      collectors:
        - type: classNameRegex
          value: '#^Zef\\Framework\\Event\\#'
    - name: Adapters
      collectors:
        - type: classNameRegex
          value: '#^Zef\\Framework\\Adapters\\#'
    - name: Kernel
      collectors:
        - type: classNameRegex
          value: '#^Zef\\Framework\\(Kernel|Version|ContainerBootstrapper|ApplicationBootstrapper|CacheStorageWiring|FrameworkDefaults)$#'
    - name: Tooling
      collectors:
        - type: classNameRegex
          value: '#^Zef\\Test\\Support\\Tooling\\#'
  ruleset:
    # Exception is the innermost layer: it may not depend on any other ZEF layer.
    Exception: ~
    # Contracts may only depend on the exception root.
    Contracts:
      - Exception
    Container:
      - Contracts
      - Exception
    # The configuration layer depends on its contract and the exception root:
    # it is a self-contained foundation the container will consume later (the
    # build order is fixed by CONTRIBUTING.md rule 2). The `Config\Routing`
    # sub-namespace is the Triad's radix tree engine: it compiles plain route
    # arrays (the configuration system's output) and shares the layer. Its
    # runtime seam (the dispatcher of roadmap step 5) resolves route handlers
    # through the container -- a one-way widening mirroring `Kernel += Config`
    # (the container itself never depends on the configuration layer).
    Config:
      - Contracts
      - Exception
      - Container
    Router:
      - Config
      - Container
      - Exception
    # Router is an inbound facade; Config/Routing remains the engine owner.
    Health:
      - Contracts
      - Exception
    # The telemetry layer is the tracing core: the W3C trace-context
    # value objects, the span/tracer/exporter contracts and their
    # live, noop and in-process implementations -- a self-contained
    # runtime subsystem the same way the Health layer is, depending
    # only on the exception root. The layer owns no configuration
    # reading of its own: the observability campaign's families read
    # their knobs through the HTTP layer's shared census (the
    # `StrictToggles`/`StrictIntegers`/`StrictKnobs` lineage), and the
    # composition seam that wires the engine lives in Middleware
    # (the `TracingFactory` construction lane, exactly as the security
    # and timing families' do). The dependency direction is one-way:
    # the engine never knows the config face exists.
    Telemetry:
      - Exception
    # The HTTP layer is the zero-library PSR-7/15/17 shim's implementation
    # side: it owns the vendored message contracts' concrete classes
    # (`ROADMAP.md`, "HTTP Layer") and depends only on the exception root.
    Http:
      - Exception
    Message:
      - Exception
    # The middleware pipeline is the execution lane over the HTTP layer's
    # PSR-15 shim: it executes the vendored contracts' concrete middlewares
    # and answers through the HTTP layer's own units (hence `Http` -- the
    # factories compose `Response`/negotiation/exposition types across the
    # lane, e.g. the error boundary's problem-details rendering and the
    # metrics family's health exposition), reads
    # the frozen configuration's `middleware.stack` key (`Config`, through the
    # factory -- construction stays separate from execution) and resolves
    # every declared middleware through the PSR-11 container (`Container`).
    # The tracing core's construction seam (`TracingFactory`) widens the lane
    # to `Telemetry`: the factory composes the tracing engine the
    # observability campaign's second family registers -- the engine's own
    # layer stays config-blind, and only this composition lane joins the two.
    # The correlation family's propagation boundary (`CorrelationMiddleware`,
    # the campaign's third family) joins them here for the same reason: it is
    # the one PSR-15 middleware whose every request answers through the
    # tracing engine, so the composition lane -- not the engine-free HTTP
    # layer -- is where its face lives. The metrics family's exposition
    # boundary (`MetricsMiddleware`, the campaign's closing family) joins
    # them for the same reason again, over the second engine its answers
    # flow from: it is the one PSR-15 middleware whose answers flow from the
    # health seam's aggregator, so the composition lane joins `Health` the
    # same way it joined `Telemetry` -- the engine's own layer stays
    # config-blind, and only the composition seam meets both engines. The
    # ecosystem export's development endpoint (`OpenApiUiMiddleware`, the
    # router lane's closing slice) widens the lane to `Export` the same way:
    # it is the one PSR-15 middleware whose answers flow from the export
    # family's document rendering, so the composition lane -- not the export
    # family's own layer -- is where the disclosure's face lives. The error
    # family's storage wiring (`ErrorStorageWiring`) widens the lane to
    # `Storage` the same one-way way: it is the fold that answers the
    # family's on-disk addresses from the frozen configuration by walking
    # the `files/**` route map's pure value component, so the composition
    # lane -- not the route map's own layer -- is where the derivation's
    # face lives, and the map stays blind to who is asking it to resolve.
    # The session family's driver composition (`SessionFactory` over the
    # `store` knob) widens the lane to `Adapters` the same one-way way:
    # the session port's own promise spells that only the composition
    # names the driver, and the factory is that composition -- the `file`
    # word wires the filesystem adapter the Adapters lane owns over the
    # port, while the engine-blind layers below keep answering the
    # `memory` default without ever knowing an adapter exists.
    Middleware:
      - Exception
      - Container
      - Config
      - Router
      - Http
      - Telemetry
      - Health
      - Export
      - Storage
      - Adapters
    # The export family is the ecosystem bridge: the route table's own
    # rendering into the interchange documents the wider PHP and tooling
    # ecosystem reads (OpenAPI 3.1, Postman Collection v2.1.0). It reads the
    # compiled table the Config Routing engine answers (the read-side seams
    # the inspection lane landed: `RadixTree::routes()`,
    # `RouteConstraints::pattern()`) and depends on nothing else but the
    # exception root -- the same one-way, engine-blind posture the Telemetry
    # layer carries: the engine never knows a document is being rendered
    # from it, and only this family's folds do the translating.
    Export:
      - Exception
      - Config
    # The storage layout is the `files/**` route map: the pure value
    # component every file-writing family resolves its on-disk lane
    # addresses through. It owns no filesystem writes, no configuration
    # reading and no error tier of its own (its refusals are the
    # construction-time InvalidArgumentException the replay directory and
    # the JSON log destination already spell) -- so it depends on nothing,
    # the same innermost posture the Exception root carries, and every
    # future consumer (the error lane's log address, the configuration
    # cache, the session file driver) reaches it one-way.
    Storage: ~
    # The event layer is the dispatcher core of the Event Source lane's
    # first slice: the name grammar, the payload shape vocabulary, the
    # listener registry and the synchronous dispatcher -- a self-contained
    # foundation with construction-time InvalidArgumentException refusals
    # only (the Storage posture), so every future consumer (the async queue,
    # the retry/dead-letter regime, the module system's `events` knob, the
    # telemetry wiring) reaches it one-way.
    Event: ~
    # The adapters lane is the ROADMAP's "Bridge to Ecosystem" made real:
    # the concrete answers to questions the core layers own as ports. Its
    # first pair is the durable delivery store -- the Event layer's
    # `DeferredDeliveryStore` port answered by the filesystem adapter
    # (`Adapters\Event\FileDeliveryStore`), the direction hexagonal spells:
    # the port depends on nothing, the adapter depends on the port. The
    # directory fold composes the storage layer's document-root judgment
    # (`StorageDocumentRoot`, the one spelling of "a web-served tree is a
    # disclosed tree" the whole tree already shares), so the lane depends
    # on Storage one-way too. Every future adapter (the view engine, the
    # database layer, the cross-process transports the roadmap names) joins
    # here, over its own port, in its own slice. The session file adapter
    # (`Adapters\Session\FileSessionAdapter` over the HTTP lane's
    # `SessionAdapterInterface` port) widens the lane to `Http`: the same
    # hexagonal direction the first pair planted -- the port depends on
    # nothing, the adapter depends on the port -- with the adapter
    # additionally reaching the Event lane one-way for the JSON-round-trip
    # walk (`SerializableValues`, the one spelling of "values that survive
    # the record" the tree already shares, composed here exactly as the
    # directory fold composes the document-root judgment).
    Adapters:
      - Event
      - Storage
      - Http
    # The kernel is the composition layer: it owns the container, the frozen
    # configuration, the config->container bootstrapper, the one-call
    # application boot orchestrator (ApplicationBootstrapper, over the
    # layered builder -> config bootstrapper -> container bootstrapper chain)
    # and the framework's code-declared defaults profile (FrameworkDefaults,
    # pure data). Each widening is additive: the orchestrator composes units
    # the layers below already own.
    # The compiled caches' storage wiring (CacheStorageWiring) widens the
    # lane to `Storage` the same one-way way the error family's wiring
    # widened the middleware lane: it is the fold that answers the boot's
    # two acceleration artifacts (the configuration cache and the container
    # AOT cache) from the composition-declared root by walking the
    # `files/**` route map's pure value component, so the composition lane
    # -- not the route map's own layer -- is where the derivation's face
    # lives, and the map stays blind to who is asking it to resolve.
    Kernel:
      - Container
      - Health
      - Message
      - Config
      - Contracts
      - Exception
      - Middleware
      - Storage
    # Tooling gates are developer/CI utilities: they may use the kernel and the
    # exception root, but no other domain layer. The widening to Container is
    # the analysis CLI lane's own: the container inventory report renders the
    # container's typed read-side answer (`ContainerInventory`, its entries,
    # the AOT boot outcome) through the same boot the application rides --
    # the composition the Kernel layer's own orchestrator already performs,
    # added here the way the middleware lane's engine widenings were. The
    # route inspection commands widen the same lane the same way: they read
    # the router facade and the compiled entries / match explanations the
    # Config Routing engine answers (`Router`, `Config`) -- read-side
    # composition over the same boot, never a parallel parse. The ecosystem
    # export commands widen it once more, the same way: `route:openapi` and
    # `route:postman` render the same compiled entries through the export
    # family's document folds (`Export`) -- read-side composition again, the
    # renderer never re-deriving what the folds already own. The storage map
    # command widens it to the layout's own component (`Storage`): the
    # inspector renders the resolved lane map the value component answers,
    # the same read-side composition over a component that owns no writes.
    # The HTTP inspection commands widen it twice more, the same way:
    # `http:dump` and `http:headers` answer a simulated exchange through
    # the same composition the runtime rides -- the middleware lane's own
    # PSR-15 request handler inside the pipeline the kernel's orchestrator
    # builds (`Middleware`) -- and render it through the HTTP layer's own
    # wire folds and security-header audit (`Http`) -- execution-side
    # composition over the same boot, the exchange never re-derived.
    Tooling:
      - Kernel
      - Exception
      - Container
      - Router
      - Config
      - Export
      - Storage
      - Http
      - Middleware
