deptrac:
  paths:
    - ./src
  exclude_files:
    # The vendored PSR shim is a zero-library boundary artifact, not a ZEF layer.
    - '#.*/Contracts/Psr/.*#'
  layers:
    - name: Exception
      collectors:
        - type: classNameRegex
          value: '#^Zef\\Framework\\Exception\\#'
    - name: Contracts
      collectors:
        - type: classNameRegex
          value: '#^Zef\\Framework\\Contracts\\#'
    - name: Container
      collectors:
        - type: classNameRegex
          value: '#^Zef\\Framework\\Container\\#'
    - name: Health
      collectors:
        - type: classNameRegex
          value: '#^Zef\\Framework\\Health\\#'
    - name: Message
      collectors:
        - type: classNameRegex
          value: '#^Zef\\Framework\\Message\\#'
    - name: Kernel
      collectors:
        - type: classNameRegex
          value: '#^Zef\\Framework\\(Kernel|Version)$#'
    - name: Tooling
      collectors:
        - type: classNameRegex
          value: '#^Zef\\Framework\\Tooling\\#'
  ruleset:
    # Exception is the innermost layer: it may not depend on any other ZEF layer.
    Exception: ~
    # Contracts may only depend on the exception root.
    Contracts:
      - Exception
    Container:
      - Contracts
      - Exception
    Health:
      - Contracts
      - Exception
    Message:
      - Exception
    Kernel:
      - Container
      - Health
      - Message
      - Contracts
      - Exception
    # Tooling gates are developer/CI utilities: they may use the kernel and the
    # exception root, but no other domain layer.
    Tooling:
      - Kernel
      - Exception
