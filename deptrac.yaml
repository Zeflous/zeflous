deptrac:
  paths:
    - ./src
  exclude_files:
    # The vendored PSR shim is a zero-library boundary artifact, not a ZEF layer.
    - '#.*/Contracts/Psr/.*#'
  layers:
    - name: Exception
      collectors:
        - type: classNameRegex
          value: '#^Zef\\Framework\\Exception\\#'
    - name: Contracts
      collectors:
        - type: classNameRegex
          value: '#^Zef\\Framework\\Contracts\\#'
    - name: Container
      collectors:
        - type: classNameRegex
          value: '#^Zef\\Framework\\Container\\#'
    - name: Config
      collectors:
        - type: classNameRegex
          value: '#^Zef\\Framework\\Config\\#'
    - name: Health
      collectors:
        - type: classNameRegex
          value: '#^Zef\\Framework\\Health\\#'
    - name: Message
      collectors:
        - type: classNameRegex
          value: '#^Zef\\Framework\\Message\\#'
    - name: Kernel
      collectors:
        - type: classNameRegex
          value: '#^Zef\\Framework\\(Kernel|Version)$#'
    - name: Tooling
      collectors:
        - type: classNameRegex
          value: '#^Zef\\Framework\\Tooling\\#'
  ruleset:
    # Exception is the innermost layer: it may not depend on any other ZEF layer.
    Exception: ~
    # Contracts may only depend on the exception root.
    Contracts:
      - Exception
    Container:
      - Contracts
      - Exception
    # The configuration layer depends on its contract and the exception root:
    # it is a self-contained foundation the container will consume later (the
    # build order is fixed by CONTRIBUTING.md rule 2). The `Config\Routing`
    # sub-namespace is the Triad's radix tree engine: it compiles plain route
    # arrays (the configuration system's output) and shares the layer. Its
    # runtime seam (the dispatcher of roadmap step 5) resolves route handlers
    # through the container -- a one-way widening mirroring `Kernel += Config`
    # (the container itself never depends on the configuration layer).
    Config:
      - Contracts
      - Exception
      - Container
    Health:
      - Contracts
      - Exception
    Message:
      - Exception
    Kernel:
      - Container
      - Health
      - Message
      - Config
      - Contracts
      - Exception
    # Tooling gates are developer/CI utilities: they may use the kernel and the
    # exception root, but no other domain layer.
    Tooling:
      - Kernel
      - Exception
