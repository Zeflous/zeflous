# SonarCloud configuration for the ZEF Framework.
#
# projectKey / organization follow the owner-provided values for this
# repository:
#   - organization "zeflous"
#   - projectKey   "zef_zeflous"
# If the SonarCloud project is created under a different key/organization,
# update the two values below to match.
sonar.projectKey=zef_zeflous
sonar.organization=zeflous
sonar.projectName=ZEF Framework

# --- Sources -------------------------------------------------------------
sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# --- Coverage / test reports (produced by PHPUnit + pcov) -----------------
sonar.php.coverage.reportPaths=build/clover.xml
sonar.php.tests.reportPath=build/junit.xml

# --- Exclusions ----------------------------------------------------------
# The vendored PSR shim is third-party (PHP-FIG) code, not ours to analyse.
sonar.exclusions=vendor/**,build/**,src/Contracts/Psr/**,index.html,package.json
sonar.coverage.exclusions=tests/**,benchmarks/**,src/autoload.php,src/Contracts/Psr/**
sonar.cpd.exclusions=src/Contracts/Psr/**

# --- Quality gate --------------------------------------------------------
# "Sonar way" is the default gate; wait for its result so the CI job fails
# when the gate is red.
sonar.qualitygate.wait=true
