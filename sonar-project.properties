# SonarCloud configuration for the ZEF Framework.
#
# projectKey / organization: adjust to match the project you create on
# sonarcloud.io. The defaults below follow SonarCloud's GitHub convention
# (<Organization>_<Repository>).
sonar.projectKey=Zeflous_zeflous
sonar.organization=zeflous
sonar.projectName=zeflous

# --- Sources -------------------------------------------------------------
sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# --- Coverage / test reports (produced by PHPUnit + pcov) -----------------
sonar.php.coverage.reportPaths=build/clover.xml
sonar.php.tests.reportPath=build/junit.xml

# --- Exclusions ----------------------------------------------------------
# The vendored PSR shim is third-party (PHP-FIG) code, not ours to analyse.
sonar.exclusions=vendor/**,build/**,src/Contracts/Psr/**,index.html,package.json
sonar.coverage.exclusions=tests/**,benchmarks/**,src/autoload.php,src/Contracts/Psr/**
sonar.cpd.exclusions=src/Contracts/Psr/**

# --- Quality gate --------------------------------------------------------
# "Sonar way" is the default gate; pin it explicitly so the CI gate is stable.
sonar.qualitygate.wait=true
