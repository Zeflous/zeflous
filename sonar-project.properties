# SonarCloud analysis configuration, read by the scanner step of
# .github/workflows/sonarcloud.yml. Scope and policy decisions are documented
# in docs/security/sonarcloud.md.
#
# sonar.projectKey / sonar.organization MUST match the values shown in
# SonarCloud (Project Administration > Project Key, and the organization key in
# the URL). These are the live values for the RESURRECTED lane (2026-10-26):
#   - organization "zefl"   — the new account's organization (the retired
#     lane's organization was "zeflous"; it is a different SonarCloud tenant,
#     so the old org's project history and gate configuration did not carry
#     over).
#   - projectKey   "zefl_zeflous" — the owner-created project; the project's
#     quality gate is "ZEF" (the owner's chosen gate name).
# Values reported by the owner 2026-10-26, hours after the retirement (PR
# #622) and minutes after the SONAR_TOKEN organization secret was refreshed.
# Re-verify any time with:
#   GET https://sonarcloud.io/api/organizations/search?organizations=zefl
#   GET https://sonarcloud.io/api/components/show?component=zefl_zeflous
# A SonarCloud organization can only decorate pull requests of GitHub
# repositories owned by the account/org it is bound to, so the ALM binding
# plus the SonarQube Cloud GitHub App grant for Zeflous/zeflous are what make
# decoration possible at all. If the project is recreated under a different
# key, update both values in the same change.
sonar.projectKey=zefl_zeflous
sonar.organization=zefl
sonar.projectName=ZEF Framework

# Base directory: restated here so a local `sonar-scanner` run (invoked from the
# repository root, exactly like the CI step) computes the same paths. The CI
# step also passes -Dsonar.projectBaseDir=. for parity with the reference
# repository.
sonar.projectBaseDir=.

sonar.sourceEncoding=UTF-8

# --- Sources -------------------------------------------------------------
# NOTE (measured on run 37652159694, 2026-10-07, first life): SonarCloud's
# analysis-scope UX analyses the WHOLE project and IGNORES sonar.sources /
# sonar.tests — the scanner warns "The following properties are configured but
# have no effect: sonar.sources, sonar.tests". They are kept because they
# document intent, but the authoritative control is the sonar.exclusions
# allow-list below.
sonar.sources=src
sonar.tests=tests

# --- Coverage / test reports (produced by PHPUnit + pcov) -----------------
# The scanner step's coverage bridge downloads these from the CI Coverage
# lane's `coverage-reports` artifact and passes them explicitly; the paths
# here are the fallback spelling for a local `sonar-scanner` run.
sonar.php.coverage.reportPaths=build/clover.xml
# Note the plural: sonar.php.tests.reportPaths (the singular spelling used
# before was silently ignored by the scanner).
sonar.php.tests.reportPaths=build/junit.xml

# --- Analysis scope: explicit allow-list, reviewable in-tree --------------
# An explicit EXCLUSION allow-list of everything that is not first-party
# source: it is fail-closed (a new top-level directory is NOT silently
# analysed — it enters the scope only when someone decides to remove its
# pattern here) and it keeps the analysis on the code this repository owns
# and tests. Carried over unchanged from the lane's first life, where it was
# the fix for the whole-repository scan that pushed new_coverage down to
# 24.6% on PR #1 (coverage was computed over ~1.4k files including the
# checked-out vendor/, build/, .scannerwork/ and caches, of which only src/
# is instrumented). `stubs/**` is on the list because the optional
# extensions' stub files are static-analysis artifacts (phpstan scanFiles /
# psalm stubs), not runtime source — their function names mirror the
# extensions' real snake_case API and their bodies are inert declarations,
# so the naming and unused-parameter rules can only fire as noise there.
sonar.exclusions=vendor/**,build/**,.scannerwork/**,.git/**,.github/**,.phpunit.cache/**,.phpunit.result.cache,.php-cs-fixer.cache,.deptrac.cache,node_modules/**,src/Contracts/Psr/**,benchmarks/**,scripts/**,stubs/**,doctum.php,rector.php,index.html,package.json,composer.json,composer.lock,README.md,ROADMAP.md,.gitignore

# Coverage denominator. tests/ is analysed-but-not-instrumented here (PHPUnit
# instruments src/ only), the vendored shim is third-party, and benchmarks/ is
# not part of the coverage promise; counting them would report 0%-covered lines
# and collapse the real src/ coverage — a measurement artefact, not a
# regression. `scripts/**` is dev/CI tooling with its own local gates.
sonar.coverage.exclusions=tests/**,benchmarks/**,scripts/**,src/autoload.php,src/Contracts/Psr/**

# Duplication: the vendored shim repeats PHP-FIG boilerplate that is not ours to
# deduplicate. First-party code stays VISIBLE to the copy-paste detector (the
# local DuplicationGate owns this boundary in the blocking battery; the cloud
# detector mirrors it, it does not replace it).
sonar.cpd.exclusions=src/Contracts/Psr/**

# --- Issue exclusions: documented, scoped, one rule one file ------------
# The repository's standing doctrine (CONTRIBUTING.md, "Analyzer-clean
# logic"): an exclusion must name the two gates that conflict and prove the
# conflict is mechanical, or it does not land. These three are the lane's
# entire issue-level history, each earned exactly that way, carried over from
# the first life unchanged.
#
# php:S1066 ("merge this if with the enclosing one") reads
# MeterCount::advanced's nested is_int guards as a style fold, but the merge
# it suggests (a single `&&`-joined condition) mints an escaping
# mutation-testing mutant -- the mixed-operand case the joined guard would
# reroute between paths answers the identical float under both (PHP widens
# the int operand either way), so no test can ever tell the merged spelling
# from the original. The nested spelling is the only one with no mutable
# binary boolean operator; it is load-bearing, exactly like the
# equivalent-mutant records infection.json5 carries (the trailing casts' own
# entry documents the same widening). Rule stays ON everywhere else; the
# file-level scope is the narrowest the multicriteria grammar offers.
sonar.issue.ignore.multicriteria=s1066metercount,s4790postmanid,s1142openapiui
sonar.issue.ignore.multicriteria.s1066metercount.ruleKey=php:S1066
sonar.issue.ignore.multicriteria.s1066metercount.resourceKey=src/Zef/Framework/Telemetry/MeterCount.php
# The Postman collection's deterministic identity hash is the S4790 rule's
# own documented false-positive class: the SHA-1 there digests the ROUTE
# TABLE's canonical encoding to render a stable `_postman_id` (the same
# table always answers the same id -- a diff-friendly spelling, never a
# secret, never a signature, never a password derivation), which is not a
# "sensitive context" by any reading of the rule's own documentation. The
# digest input is public route-table data and the output is a display
# identifier. Rule stays ON everywhere else (a real password-style hash
# elsewhere still fires); the file-level scope is the narrowest the
# multicriteria grammar offers.
sonar.issue.ignore.multicriteria.s4790postmanid.ruleKey=php:S4790
sonar.issue.ignore.multicriteria.s4790postmanid.resourceKey=src/Zef/Framework/Export/PostmanCollection.php
# The OpenAPI UI middleware's PSR-15 face carries one early return per answer
# the boundary owns (the non-development pass-through, the spec document, the
# UI shell, the delegation) -- the family's own double-gate shape, spelled
# exactly as the thirteen PSR-15 faces before it spell theirs. Collapsing the
# four returns into one synthesized response object would trade a readable
# early-exit face for a builder with no other caller; the S1142 ceiling is
# the wrong instrument for a boundary with four honest answers. Rule stays ON
# everywhere else.
sonar.issue.ignore.multicriteria.s1142openapiui.ruleKey=php:S1142
sonar.issue.ignore.multicriteria.s1142openapiui.resourceKey=src/Zef/Framework/Middleware/OpenApiUiMiddleware.php

# --- Quality gate --------------------------------------------------------
# The project's gate is "ZEF" (selected project-side on the new account).
# Wait for the server-side verdict so the CI job's conclusion mirrors it --
# the lane is advisory for merges, but its check-run must never certify a
# green gate the server did not answer.
sonar.qualitygate.wait=true
