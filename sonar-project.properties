# SonarCloud analysis configuration, read by the scanner step of
# .github/workflows/sonarcloud.yml. Scope and policy decisions are documented
# in docs/security/sonarcloud.md.
#
# sonar.projectKey / sonar.organization MUST match the values shown in
# SonarCloud (Project Administration > Project Key, and the organization key in
# the URL). These are the live, verified values for this repository:
#   - organization "zeflous"  — verified via
#     GET https://sonarcloud.io/api/organizations/search?organizations=zeflous
#     (display name "Zeflous", avatar bound to GitHub org id 334126135);
#     the key "zef" returns 0 results.
#   - projectKey   "zef_zeflous" — verified via
#     GET https://sonarcloud.io/api/components/show?component=zef_zeflous
#     (organization "zeflous", public, analysed).
# A SonarCloud organization can only decorate pull requests of GitHub
# repositories owned by the account/org it is bound to, so these two values are
# also what makes decoration possible at all. If the project is recreated under
# a different key, update both values in the same change.
sonar.projectKey=zef_zeflous
sonar.organization=zeflous
sonar.projectName=ZEF Framework

# Base directory: restated here so a local `sonar-scanner` run (invoked from the
# repository root, exactly like the CI step) computes the same paths. The CI
# step also passes -Dsonar.projectBaseDir=. for parity with the reference
# repository.
sonar.projectBaseDir=.

sonar.sourceEncoding=UTF-8

# --- Sources -------------------------------------------------------------
# NOTE (measured on run 37652159694, 2026-10-07): SonarCloud's new
# analysis-scope UX analyses the WHOLE project and IGNORES sonar.sources /
# sonar.tests — the scanner warns "The following properties are configured but
# have no effect: sonar.sources, sonar.tests". They are kept because they
# document intent, but the authoritative control is the sonar.exclusions
# allow-list below.
sonar.sources=src
sonar.tests=tests

# --- Coverage / test reports (produced by PHPUnit + pcov) -----------------
sonar.php.coverage.reportPaths=build/clover.xml
# Note the plural: sonar.php.tests.reportPaths (the singular spelling used
# before was silently ignored by the scanner).
sonar.php.tests.reportPaths=build/junit.xml

# --- Analysis scope: explicit allow-list, reviewable in-tree --------------
# The previous revision relied on sonar.sources/sonar.tests alone, which the new
# scope UX ignores, so the analysed surface was the ENTIRE repository including
# the checked-out vendor/, build/, .scannerwork/ and cache directories. That is
# what pushed new_coverage down to 24.6% on PR #1 (coverage was computed over
# ~1.4k files, of which only src/ is instrumented).
#
# The list below is an explicit EXCLUSION allow-list of everything that is not
# first-party source: it is fail-closed (a new top-level directory is NOT
# silently analysed — it enters the scope only when someone decides to remove
# its pattern here) and it keeps the analysis on the code this repository owns
# and tests.
sonar.exclusions=vendor/**,build/**,.scannerwork/**,.git/**,.github/**,.phpunit.cache/**,.phpunit.result.cache,.php-cs-fixer.cache,.deptrac.cache,node_modules/**,src/Contracts/Psr/**,benchmarks/**,scripts/**,doctum.php,rector.php,index.html,package.json,composer.json,composer.lock,README.md,ROADMAP.md,.gitignore

# Coverage denominator. tests/ is analysed-but-not-instrumented here (PHPUnit
# instruments src/ only), the vendored shim is third-party, and benchmarks/ is
# not part of the coverage promise; counting them would report 0%-covered lines
# and collapse the real src/ coverage — a measurement artefact, not a
# regression. `scripts/**` is dev/CI tooling with its own local gates.
sonar.coverage.exclusions=tests/**,benchmarks/**,scripts/**,src/autoload.php,src/Contracts/Psr/**

# Duplication: the vendored shim repeats PHP-FIG boilerplate that is not ours to
# deduplicate. First-party code stays VISIBLE to the copy-paste detector.
sonar.cpd.exclusions=src/Contracts/Psr/**

# --- Quality gate --------------------------------------------------------
# "Sonar way" is the default gate; wait for the server-side verdict so the CI
# job fails when the gate is red.
sonar.qualitygate.wait=true
