# PhpCodeArcheology SARIF lane.
#
# Publishes the PhpCodeArcheology architecture & maintainability report to
# GitHub Code Scanning (Security -> Code scanning alerts) and exposes a stable
# status check named "PhpCodeArcheology SARIF".
#
# WHY A SEPARATE LANE
# -------------------
# `ci-strict.yml` already runs the analysis, but its status-check context is
# "CI Strict". Code Scanning needs `security-events: write`, which the
# least-privilege "CI Strict" job deliberately does not hold. Keeping the SARIF
# upload in its own job means the write permission is scoped to exactly one
# job, and the check name is stable and self-describing.
#
# CONVENTIONS
# -----------
#   * Every `uses:` is pinned to a FULL 40-character commit SHA with the
#     original tag kept as a trailing comment (supply-chain hygiene).
#   * Least privilege: `contents: read` to check out, `security-events: write`
#     only to upload the SARIF.
#   * The job NAME "PhpCodeArcheology SARIF" is the status-check context.

name: PhpCodeArcheology SARIF

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# NEVER CANCEL A RUN OF A DIFFERENT HEAD -- KEY THE GROUP PER COMMIT
# (fixed 2026-10-10, mirrors ci-strict.yml). On a `pull_request` event
# `github.ref` is the ephemeral merge ref `refs/pull/N/merge`, which MUTATES
# whenever the pull request is updated: two runs for two different heads share
# one group, and GitHub's `cancel-in-progress` is a best-effort, unordered
# cancellation -- the NEWEST run is sometimes the victim (observed on PR #136:
# the lane runs for head 92f182e0 were cancelled by a run for the older head
# 511c72c5 that entered the group one second earlier). A cancelled lane leaves
# the required check `cancelled`, the `CI Strict` aggregator polls it as
# pending for 60 minutes, times out, and the pull request is blocked even
# though nothing is wrong with its code.
#
# Keying the group on the COMMIT under verification (the pull-request head
# sha, falling back to the push sha) makes two runs for two different heads
# land in two different groups, so a new run can never be cancelled by a stale
# one: it starts immediately and reports its own check-run. `cancel-in-
# progress: false` is deliberate -- with per-commit groups the only runs that
# can share a group are duplicates of the SAME commit, and letting both run
# (rather than cancelling one) guarantees the check-run is reported (see the
# CONCURRENCY note in ci-strict.yml for the full rationale).
concurrency:
  group: archeology-${{ github.event_name }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  archeology-sarif:
    name: PhpCodeArcheology SARIF
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      # Required by github/codeql-action/upload-sarif to publish results.
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PhpCodeArcheology analysis (SARIF + Markdown)
        # Writes build/archeology/sarif/report.sarif.json and the Markdown
        # summary. The MCP server the tool ships is intentionally NOT used.
        run: composer archeology

      - name: Normalise SARIF paths and gate on error-level findings
        # GitHub Code Scanning only accepts repository-relative URIs, and the
        # tool's own `--fail-on=error` counts the relative "effort/MI/LCOM
        # above/below average" warnings as errors. This step rewrites the paths
        # and fails only on genuine error-level architecture defects.
        run: php scripts/ci/archeology-gate.php build/archeology/sarif/report.sarif.json

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          sarif_file: build/archeology/sarif/report.sarif.json
          category: phpcodearcheology

      - name: Upload PhpCodeArcheology reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: phpcodearcheology-sarif
          path: build/archeology/
          if-no-files-found: ignore
          retention-days: 14
