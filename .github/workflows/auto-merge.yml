# Auto-merge lane: arms GitHub's native auto-merge on open pull requests so a
# PR merges itself the moment every required gate is green — no human click.
#
# WHY THIS FILE EXISTS
# --------------------
# The repository's branch ruleset (`main`) requires the `CI Strict` status
# check and a 90% code-coverage floor. A PR therefore cannot be merged until
# those gates pass. GitHub's *native* auto-merge is the mechanism that turns
# "gates green" into "merged" without a human: once armed, GitHub performs the
# merge itself as soon as the required checks succeed.
#
# The problem this file solves: arming auto-merge is only accepted while the
# PR is still *waiting* on something. If you try to arm it on a PR that is
# already fully green and up to date, GitHub rejects the request with
# `UNPROCESSABLE: "Pull request is in clean status"` — which is exactly what
# happened when the merge was attempted by hand. The fix is to arm auto-merge
# EARLY (on `opened`/`synchronize`, while checks are still pending) and to keep
# re-arming it on a schedule, so a PR is never left un-armed.
#
# METHOD (mirrors the reference repository `zeflous/zef-framework`,
# `.github/workflows/auto-update-prs.yaml`)
# ---------------------------------------------------------------------------
#   * FIFO queue: open, non-draft PRs are processed oldest-first.
#   * Branch sync: a PR that is behind `main` is updated first (the REST
#     `update-branch` endpoint). This both satisfies the ruleset's
#     "require branches to be up to date" policy and re-triggers CI, which
#     puts the PR back into a *waiting* state where auto-merge can be armed.
#   * Arm auto-merge: `gh pr merge --auto --merge` (the same call the
#     reference uses). Auto-merge then obeys the branch ruleset: the merge
#     happens automatically once `CI Strict` is green.
#   * Clean-status edge case: if the PR is ALREADY fully green and up to date,
#     GitHub refuses to arm auto-merge ("clean status"). That is not a failure
#     — it means the auto-merge condition is already satisfied and there is
#     nothing left to wait for. The step reports it as READY and leaves the
#     merge to GitHub's own merge queue / the maintainer; it never performs a
#     direct, un-gated merge.
#
# PROMPT, NON-GATED TRIGGER (why `workflow_run` is here)
# -----------------------------------------------------
#   * A changelog lane pushes its update branch with the built-in
#     `GITHUB_TOKEN`. GitHub then leaves the `pull_request` runs of THIS
#     workflow (and of every other `pull_request` workflow) waiting for
#     maintainer approval — conclusion `action_required`. A run that is itself
#     waiting for approval cannot approve anything, so the `pull_request`
#     trigger alone can never clear the gate, and the required `CI Strict`
#     check never turns green.
#   * `workflow_run` is NOT subject to that approval gate. When a changelog
#     lane finishes, this workflow sweeps immediately and approves the waiting
#     runs, so the bot PRs merge without a human. The periodic `schedule` sweep
#     remains as a safety net.
#   * Optional `ZEF_TOKEN`: if the owner adds a fine-grained PAT under that
#     secret name (organization-level secret `ZEF_TOKEN`), it is preferred over
#     the built-in token. A push/approve made
#     with a human-owned token is attributed to a human actor, so the runs are
#     not left waiting in the first place. Absent the secret, the built-in
#     token is used and the auto-approve step still clears any waiting run.
#
# CONVENTIONS
# -----------
#   * Every `uses:` is pinned to a FULL 40-character commit SHA with the
#     original tag kept as a trailing comment. Tag/branch refs are what
#     SonarCloud flags as `githubactions:S7637`; pinning keeps supply-chain
#     findings at zero without any rule exclusion.
#   * Least privilege: `contents: write` (branch sync) + `pull-requests: write`
#     (arm auto-merge) + `actions: write` (approve a run that a bot-authored
#     push left waiting for approval). Nothing else.
#   * The job never fails the queue because of one problematic PR: every error
#     path is a warning, and the job exits 0.

name: Auto Merge

on:
  pull_request:
    branches:
      - main
    # Arm-on-open: the PR is processed the moment it appears, while its checks
    # are still pending — the only window in which auto-merge can be armed.
    # `synchronize` re-arms after every push; `ready_for_review` covers a PR
    # that was opened as a draft; `closed` keeps the FIFO chain alive after a
    # merge (the next PR is then synced and armed without waiting for cron).
    types: [opened, reopened, ready_for_review, synchronize, closed]
  # Prompt, NON-GATED trigger. A changelog lane pushes its update branch with
  # the built-in `GITHUB_TOKEN`, which leaves the pull-request runs of THIS
  # workflow (and of every other `pull_request` workflow) waiting for
  # maintainer approval ("action_required"). A run that is itself waiting for
  # approval cannot approve anything, so the `pull_request` trigger alone can
  # never clear the gate. `workflow_run` is NOT subject to that approval gate,
  # so when a changelog lane finishes we sweep immediately and approve the
  # waiting runs. This is what lets the bot PRs merge without a human.
  workflow_run:
    workflows:
      - "Changelog"
      - "Changelog (official generator)"
      - "Changelog tests"
    types: [completed]
  # Safety net: the GitHub scheduler is not perfectly reliable, so a periodic
  # sweep re-arms any PR that a missed event left un-armed. Off the :00/:30
  # peak minutes on purpose (GitHub drops cron runs that land exactly there).
  schedule:
    - cron: '7,27,47 * * * *'
  # Allow a manual sweep (e.g. right after enabling auto-merge on the repo).
  workflow_dispatch:

# One run at a time: a cron sweep and a PR event must not fight over the same
# PR. `cancel-in-progress: false` lets the queued run proceed after the current
# one instead of being dropped.
concurrency:
  group: auto-merge
  cancel-in-progress: false

jobs:
  auto-merge:
    # Run on cron/manual, on any meaningful PR lifecycle event, and on a
    # `closed` event ONLY when the PR was actually merged (a closed-without-
    # merge PR has nothing to re-process). `workflow_run` and `schedule` are
    # not `pull_request` events, so they always run.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.action != 'closed' ||
      github.event.pull_request.merged == true
    name: Auto Merge
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write      # sync a behind branch (update-branch endpoint)
      pull-requests: write # read the PR list + arm auto-merge
      actions: write       # approve a run left waiting by a bot-authored push

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Process open pull requests (oldest first)
        env:
          # `gh` authenticates with the built-in workflow token (`GITHUB_TOKEN`)
          # by default. If the owner has added the optional fine-grained PAT as
          # the organization-level secret `ZEF_TOKEN`, it is preferred: a
          # push/approve performed with a
          # human-owned token is attributed to a human actor, so the resulting
          # runs are NOT left waiting for approval in the first place. When the
          # secret is absent the expression falls back to the built-in token and
          # the auto-approve step below still clears any waiting run. The token
          # is referenced by NAME only; its value is injected at run time and
          # never written to a file or log.
          #
          # PAT SCOPE CAVEAT: a fine-grained PAT only carries the scopes it was
          # granted, and a push/approve/update-branch performed with it is
          # authorised by THOSE scopes -- not by this job's `permissions:` block.
          # An under-scoped PAT therefore fails with 403 "Resource not accessible
          # by personal access token" (observed on the `update-branch` call, which
          # needs `contents: write`), leaving a `behind` PR un-synced and
          # auto-merge waiting forever. Every write below therefore retries with
          # the built-in token via `BUILTIN_TOKEN` when the PAT is refused.
          #
          # QUEUE-CHAIN NOTE: a merge executed by `github-actions[bot]`
          # (GITHUB_TOKEN) emits no follow-up workflow event (GitHub's recursion
          # guard), so the `closed` handler does not fire and the next pull
          # request is picked up by the next sweep instead of immediately.
          # Neither token can bypass the ruleset -- the merge still waits for the
          # required `CI Strict` check to be green.
          GH_TOKEN: ${{ secrets.ZEF_TOKEN || secrets.GITHUB_TOKEN }}
          # Kept separately so the arm step can fall back to the workflow token
          # if the primary arm attempt is rejected for a transient reason.
          GITHUB_TOKEN: ${{ secrets.ZEF_TOKEN || secrets.GITHUB_TOKEN }}
          # The built-in workflow token, always present and always carrying this
          # job's declared permissions. Used as the fallback for repo writes when
          # the optional PAT is refused for lack of scope.
          BUILTIN_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u

          echo "Fetching open, non-draft pull requests (oldest first)..."
          if ! raw=$(gh pr list --state open --limit 100 --json number,isDraft,createdAt); then
            echo "::warning::Could not list pull requests; nothing to do."
            exit 0
          fi

          # `gh pr list` has no --sort flag; sort the JSON ourselves so the
          # oldest PR is processed first (FIFO), matching the reference repo.
          prs=$(printf '%s' "$raw" \
            | jq -r 'sort_by(.createdAt) | .[] | select(.isDraft == false) | .number')

          if [ -z "$prs" ]; then
            echo "No open pull requests to process."
            exit 0
          fi

          for pr in $prs; do
            echo "----------------------------------------"
            echo "Processing PR #$pr..."

            # A PR can be closed/merged concurrently while this loop runs, so a
            # failed read is expected and must skip the PR, not kill the job.
            branch=$(gh pr view "$pr" --json headRefName --jq '.headRefName' 2>/dev/null) || {
              echo "::warning::PR #$pr is no longer readable (closed?) — skipping."
              continue
            }
            before_sha=$(gh pr view "$pr" --json headRefOid --jq '.headRefOid' 2>/dev/null) || {
              echo "::warning::PR #$pr head is unreadable — skipping."
              continue
            }
            # Timestamp taken 5s in the past to absorb runner/server clock skew.
            update_started=$(date -u -d '5 seconds ago' +%Y-%m-%dT%H:%M:%SZ)

            # 1. Sync the branch if it is behind `main`. The REST endpoint
            #    returns 202 (async) on success and 422 "no new commits on the
            #    base branch" when already up to date. The `if` form captures
            #    the exit code safely under `set -e`-style handling.
            updated=0
            for attempt in 1 2 3; do
              if resp=$(gh api -X PUT "repos/${GITHUB_REPOSITORY}/pulls/${pr}/update-branch" 2>&1); then
                echo "PR #$pr: branch update accepted (202) — CI will re-run."
                updated=1
                break
              fi
              if printf '%s' "$resp" | grep -q 'no new commits on the base branch'; then
                # GitHub can evaluate `update-branch` against a STALE PR base and
                # answer "no new commits" for a branch that is really behind.
                # Re-read the live merge state and retry only when the PR
                # genuinely reports BEHIND, so a genuinely-stale PR is still
                # synced without hammering the API when it is truly up to date.
                ms=$(gh pr view "$pr" --json mergeStateStatus --jq '.mergeStateStatus' 2>/dev/null) || ms=""
                if [ "$ms" = "BEHIND" ] && [ "$attempt" -lt 3 ]; then
                  echo "PR #$pr reports BEHIND but the sync was a no-op; retrying (attempt $attempt)..."
                  sleep 4
                  continue
                fi
                echo "PR #$pr is already up to date with the base branch."
                break
              fi
              # The optional PAT is preferred, but a fine-grained PAT only has
              # the scopes it was granted. `update-branch` needs `contents:
              # write`; an under-scoped PAT answers 403 "Resource not accessible
              # by personal access token", which would leave this PR `behind`
              # forever (the ruleset requires an up-to-date branch). Retry with
              # the built-in token, which always carries this job's declared
              # `contents: write`.
              if printf '%s' "$resp" | grep -qiE 'not accessible|forbidden|403'; then
                if resp=$(GH_TOKEN="$BUILTIN_TOKEN" gh api -X PUT "repos/${GITHUB_REPOSITORY}/pulls/${pr}/update-branch" 2>&1); then
                  echo "PR #$pr: branch update accepted (202) via the built-in token — CI will re-run."
                  updated=1
                  break
                fi
              fi
              # The branch could not be synced. The common causes are a genuine
              # merge conflict, a fork head, or a transient API error. This must
              # NOT abort the sweep: arming auto-merge is still
              # correct and useful (GitHub merges the PR itself once the
              # required check is green and the branch is up to date), and a
              # later cron sweep retries the sync. Only a real conflict leaves
              # the PR un-mergeable, and that is the maintainer's call — never a
              # silent skip of the whole PR.
              echo "::warning::Could not update PR #$pr branch: $resp"
              echo "   (A conflicting PR, a fork head, or a transient API error legitimately fails here.)"
              break
            done

            # 2. A bot-authored push (the built-in `GITHUB_TOKEN`) leaves the
            #    new runs waiting for maintainer approval ("action_required"),
            #    so the required `CI Strict` check never turns green and
            #    auto-merge waits forever. Approve them via the API (equivalent
            #    to the "Approve and run" button). This runs on EVERY sweep,
            #    not only after a branch sync: the changelog lanes push with
            #    the built-in token and their runs are left waiting even when
            #    the branch is already up to date. Fork PRs are skipped -
            #    approving an untrusted fork's run is a maintainer decision,
            #    not this lane's.
            is_fork=$(gh pr view "$pr" --json isCrossRepository --jq '.isCrossRepository' 2>/dev/null) || is_fork="false"
            if [ "$is_fork" = "true" ]; then
              echo "PR #$pr is from a fork - leaving run approval to a maintainer."
            else
              # CRITICAL: the branch sync above may have MOVED the PR head (the
              # update-branch call is asynchronous), and the runs on the NEW head
              # are the ones that need approval. Approving only the head read
              # before the update approves nothing -- the old head is superseded
              # and its runs are gone -- which is exactly how a merge used to
              # stall. Poll for up to ~60s and approve every waiting run that
              # belongs to EITHER the PR's current head (the case where the
              # changelog lane pushed with the built-in token and the head is
              # fresh) OR a head that is newer than the pre-update head and was
              # created after this sweep requested the update (the post-sync
              # case). This mirrors the reference repository's behaviour.
              ids=""
              head_sha="$before_sha"
              for attempt in $(seq 1 12); do
                head_sha=$(gh pr view "$pr" --json headRefOid --jq '.headRefOid' 2>/dev/null) || head_sha="$before_sha"
                runs_json=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?branch=${branch}&per_page=50" 2>/dev/null) || runs_json='{"workflow_runs":[]}'
                ids=$(printf '%s' "$runs_json" \
                  | jq -r --arg head "$head_sha" --arg before "$before_sha" --arg start "$update_started" \
                        '.workflow_runs[]
                         | select(.conclusion == "action_required")
                         | select(.head_sha == $head or (.head_sha != $before and .created_at > $start))
                         | .id')
                if [ -n "$ids" ]; then
                  break
                fi
                # After a sync, if a new head already produced runs that are NOT
                # waiting for approval (a non-bot actor pushed), there is nothing
                # to approve -- stop polling instead of burning the whole window.
                if [ "$updated" = "1" ] && [ "$attempt" -gt 2 ]; then
                  n_new=$(printf '%s' "$runs_json" \
                    | jq -r --arg start "$update_started" '[.workflow_runs[] | select(.created_at > $start)] | length')
                  if [ "${n_new:-0}" -gt 0 ]; then
                    break
                  fi
                fi
                sleep 5
              done
              if [ -n "$ids" ]; then
                for id in $ids; do
                  if err=$(gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/approve" 2>&1); then
                    echo "Approved run ${id} via API."
                  elif err=$(GH_TOKEN="$BUILTIN_TOKEN" gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/approve" 2>&1); then
                    echo "Approved run ${id} via API (built-in token)."
                  else
                    echo "::warning::Could not approve run ${id}: $err"
                  fi
                done
              else
                echo "No run waiting for approval on the current head."
              fi
            fi

            # Give GitHub a moment to settle internal state before arming.
            sleep 3

            # 3. Arm auto-merge. This is the whole point of the lane: once
            #    armed, GitHub merges the PR itself as soon as `CI Strict` is
            #    green. Re-arming on every run keeps the state from being lost.
            if err=$(gh pr merge "$pr" --auto --merge 2>&1); then
              echo "Auto-merge armed for PR #$pr."
            elif printf '%s' "$err" | grep -qi 'clean status'; then
              # The PR is already fully green and up to date: the auto-merge
              # condition is satisfied and there is nothing left to wait for.
              # This is NOT a failure and NOT a manual merge — the merge is
              # left to GitHub's own merge queue / the maintainer.
              echo "PR #$pr is already in a clean, mergeable state (auto-merge not needed)."
            elif err2=$(GH_TOKEN="$BUILTIN_TOKEN" gh pr merge "$pr" --auto --merge 2>&1); then
              # The first arm attempt was rejected for a transient reason; a
              # retry with the built-in workflow token succeeds. Arming is what
              # matters here — the merge itself still waits for the required
              # `CI Strict` check, so this never bypasses the ruleset.
              echo "Auto-merge armed for PR #$pr (retry)."
            elif printf '%s' "$err2" | grep -qi 'clean status'; then
              echo "PR #$pr is already in a clean, mergeable state (auto-merge not needed)."
            else
              echo "::warning::Could not arm auto-merge for PR #$pr: $err / $err2"
            fi

            sleep 5
          done

          # Every error path above is a warning; the sweep itself succeeded.
          exit 0
