# Strict CI lane -- mutation testing (the heaviest lane), kept in its own file.
#
# SPLIT OUT OF `.github/workflows/ci-strict.yml` (2026-10-08). Infection can run
# for tens of minutes; while it shared a file with the fast lanes it was the one
# lane everybody else waited behind, and retrying a flaky fast lane would also
# re-run mutation testing. As its own workflow it is retried, cancelled and
# reported on independently.
#
# The job NAME below ("CI Infection") is the status-check context -- keep it
# stable.

name: CI Infection

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
  workflow_dispatch:

# Least privilege: the lane reads the repository and writes nothing back.
permissions:
  contents: read

# NEVER CANCEL A RUN OF A DIFFERENT HEAD -- KEY THE GROUP PER COMMIT
# (fixed 2026-10-10, mirrors ci-strict.yml). On a `pull_request` event
# `github.ref` is the ephemeral merge ref `refs/pull/N/merge`, which MUTATES
# whenever the pull request is updated: two runs for two different heads share
# one group, and GitHub's `cancel-in-progress` is a best-effort, unordered
# cancellation -- the NEWEST run is sometimes the victim (observed on PR #136:
# the lane runs for head 92f182e0 were cancelled by a run for the older head
# 511c72c5 that entered the group one second earlier). A cancelled lane leaves
# the required check `cancelled`, the `CI Strict` aggregator polls it as
# pending for 60 minutes, times out, and the pull request is blocked even
# though nothing is wrong with its code.
#
# Keying the group on the COMMIT under verification (the pull-request head
# sha, falling back to the push sha) makes two runs for two different heads
# land in two different groups, so a new run can never be cancelled by a stale
# one: it starts immediately and reports its own check-run. `cancel-in-
# progress: false` is deliberate -- with per-commit groups the only runs that
# can share a group are duplicates of the SAME commit, and letting both run
# (rather than cancelling one) guarantees the check-run is reported (see the
# CONCURRENCY note in ci-strict.yml for the full rationale).
concurrency:
  group: ci-infection-${{ github.event_name }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  # Mutation testing -- the heaviest lane, isolated so it cannot block the rest.
  ci-infection:
    name: CI Infection
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP 8.4 with pcov
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: pcov
          coverage: pcov
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run mutation testing (composer ci:infection)
        # Infection (MSI 100) plus the mutation-score floor.
        run: composer ci:infection
