name: Auto Assign
on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

# One run per issue/PR; never cancel an in-flight assignment.
concurrency:
  group: auto-assign-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
    - name: 'Auto-assign issue'
      uses: pozil/auto-assign-issue@af6beea6bdf1e8eb373f061c5bc168681fc6d011 # v4.0.1
      with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          assignees: mbetixz
          numOfAssignee: 1
