# SonarCloud quality gate: cloud-side static analysis (bugs, vulnerabilities,
# code smells, duplications, security hotspots) over the repository, with a
# blocking quality-gate verdict and pull-request decoration.
#
# READ FIRST: docs/security/sonarcloud.md — it records the scope/policy
# decisions and the one-time SonarCloud account setup this file depends on.
#
# WHY THIS FILE WAS REWRITTEN (2026-10-07, PR decoration investigation)
# -------------------------------------------------------------------
# Analysis ran and the gate was green, but NO SonarCloud decoration appeared on
# pull requests (#1/#2): no `sonarqubecloud[bot]` comment and no
# "SonarCloud Code Analysis" check-run from the GitHub App `sonarqubecloud`.
# Compared against the reference repository `zeflous/zef-framework` (whose PRs
# DO carry the decoration), the measured differences were:
#
#   1. ANALYSED SURFACE. The job analysed the entire repository — the previous
#      header pinned the scanner action, but the checked-out tree still held
#      `vendor/`, `build/`, `.scannerwork/`, caches — so `new_coverage` was
#      computed over ~1.4k mostly-irrelevant files (24.6% on PR #1) instead of
#      over `src/`. The reference narrows the surface with an explicit
#      `sonar.exclusions` allow-list (SonarCloud's new analysis-scope UX
#      analyses the whole project and *ignores* `sonar.sources`/`sonar.tests`).
#      The scanner is now handed `-Dsonar.projectBaseDir=.` explicitly.
#      A "Analysis scope (diagnostic)" step prints the analysed file count so
#      scope drift is visible, never silent.
#
#   2. PR DECORATION IS DELIVERED BY THE GITHUB APP, NOT BY THIS WORKFLOW.
#      The analysis was ALREADY correct: the jobs API showed
#      `permissions: PullRequests: read`, the scanner log showed
#      "Detected project binding: BOUND", "Auto-configuring pull request 2",
#      "Pull request 2 for merge into main" and
#      "QUALITY GATE STATUS: PASSED ...&pullRequest=2", and the SonarCloud API
#      (`/api/project_pull_requests/list?project=zef_zeflous`) returned the PRs
#      with `"url":"https://api.github.com/repos/Zeflous/zeflous/pulls/2"`.
#      Decoration is produced by the SonarCloud service through the GitHub App
#      `sonarqubecloud` (installation 165585169 on org `Zeflous`), whose
#      permissions are `checks:write` + `pull_requests:write`. That
#      installation's `repository_selection` is **selected**, and the token in
#      this sandbox is not an app JWT, so the selected-repository list could
#      not be enumerated from CI — but `Zeflous/zeflous` demonstrably carries
#      no `sonarqubecloud` check-run while `Zeflous/zef-framework` does. The
#      fix is therefore an ACCOUNT-SIDE change (grant the app the repository),
#      recorded step by step in docs/security/sonarcloud.md; this file keeps the
#      guard and the analysis correct so decoration follows the moment the app
#      is granted the repository.
#
#   3. SCANNER ACTION. Switched to `SonarSource/sonarqube-scan-action`
#      (pinned to the full commit SHA of tag v8.2.2), the action used by the
#      reference repository. The previous `sonarcloud-github-action` v3
#      wrapper runs its scanner inside a Docker container; the reference's
#      action runs the scanner engine directly. Both were functional here, but
#      parity with the reference removes a variable from the investigation.
#
#   4. COVERAGE SOURCE (2026-10-08, "composer install not needed here"). The job
#      installs NO dependencies and runs NO tests: the analysis needs SOURCE plus
#      a coverage report, and sonar-project.properties derives no path from
#      vendor/. It bridges the CI Coverage lane's `coverage-reports` artifact
#      (clover + JUnit) on EVERY event, exactly like the reference repository, so
#      the duplicated `composer install` -- and its transient codeload HTTP/2 429
#      rate-limit failures -- are gone. See the bridge step below.
#
#   5. HEAVY LANES SPLIT (2026-10-08). The four strict lanes moved out of
#      `ci-strict.yml` into one workflow each (`ci-static.yml`, `ci-coverage.yml`,
#      `ci-infection.yml`, `ci-bench.yml`) so a slow lane no longer entangles the
#      others and each can be retried alone; `ci-strict.yml` is now the thin
#      aggregator that keeps the required `CI Strict` check. The bridge below
#      therefore waits on `ci-coverage.yml`, which is the lane that produces the
#      `coverage-reports` artifact -- the same artifact, a narrower wait.
#
# CONTRACT (narrowed 2026-10-18, merge-gate audit finding 5 —
# docs/ci-notes/merge-gate-audit.md): this job ALWAYS runs and concludes, but
# the uncredentialed outcome now depends on WHERE the credential is missing. In
# a context where GitHub itself withholds repository secrets — a `pull_request`
# event whose head is from a fork, or whose author is `dependabot[bot]` or
# `renovate[bot]` — it reports GREEN WITH A NOTICE (step summary +
# `::notice::`): a context that cannot be credentialed must not block the
# pull-request queue. In every other context — a same-repository pull request,
# a push to `main`, a manual run — the `SONAR_TOKEN` secret is always
# injectable, so its absence is a misconfiguration, and the job FAILS CLOSED
# instead of certifying an analysis that never ran: `SonarCloud analysis` is a
# REQUIRED check in the `main` ruleset, and a required check must never be
# green without an analysis. Never work around the secret withholding with
# `pull_request_target`.
#
# MERGE QUEUE (2026-10-18, finding 3 of the merge-gate audit): the queue path
# analyses the merge group's head sha using this file's DEFAULT-BRANCH version.
# Secrets are injectable in a `merge_group` context, so the guard above treats
# it exactly like a push to `main` (an absent SONAR_TOKEN fails closed). The
# scan targets a short-lived, PER-ENTRY SonarCloud branch (`merge-queue/pr-N`,
# resolved from the queue ref) because the
# SonarCloud GitHub App does not report on merge groups (product management
# statement, May 2024, community.sonarsource.com/t/112436 -- still without
# official merge-queue support as of this writing): the workflow's own required
# check therefore carries the queue-path enforcement, and
# `sonar.qualitygate.wait=true` (sonar-project.properties) makes the job wait
# for the server-side gate verdict on that branch -- the same server-side
# quality gate the pull-request path decorates. (The branch name is per entry
# because a group of N entries runs N concurrent scans, and a shared name made
# their server-side compute-engine tasks race -- the loser died with
# "CE Task finished abnormally", 2026-10-18.) When the ruleset's merge queue
# is enabled, the `SonarCloud Code Analysis` APP check moves OFF the required
# set (it cannot report on merge groups); it stays on pull requests as
# advisory decoration, and the blocking verdict travels with this job.

name: SonarCloud

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  # MERGE QUEUE: analyse the merge group the queue assembled (see the MERGE
  # QUEUE note in the header). Secrets are injectable in this context, so the
  # guard below holds it to the push-to-main standard: an absent SONAR_TOKEN
  # fails closed. The scan runs against the short-lived SonarCloud branch
  # `merge-queue` (see the scanner step's args).
  merge_group:
    branches:
      - main
  # Allow a manual run (e.g. right after adding the SONAR_TOKEN secret).
  # `pr_number` lets an automation lane analyse a pull request whose
  # `pull_request` event never fired (a PR opened by the built-in
  # `GITHUB_TOKEN` does not trigger workflows -- GitHub's recursion guard).
  # Without it the ruleset's `code_quality` rule has no SonarCloud analysis to
  # read and blocks the merge.
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to analyse (optional)"
        required: false
        type: string
      coverage:
        description: "Upload this run's clover/JUnit reports as the coverage-reports artifact (CI only; leave unset manually)"
        required: false
        type: boolean
        default: false

# Least privilege: the analysis reads the repository; the SonarSource action
# queries pull-request metadata.
permissions:
  contents: read
  pull-requests: read

# Supersede a stale run for the same ref instead of queueing behind it.
# NEVER CANCEL A RUN OF A DIFFERENT HEAD -- KEY THE GROUP PER COMMIT
# (fixed 2026-10-10, mirrors ci-strict.yml). On a `pull_request` event
# `github.ref` is the ephemeral merge ref `refs/pull/N/merge`, which MUTATES
# whenever the pull request is updated: two runs for two different heads share
# one group, and GitHub's `cancel-in-progress` is a best-effort, unordered
# cancellation -- the NEWEST run is sometimes the victim (observed on PR #136:
# the lane runs for head 92f182e0 were cancelled by a run for the older head
# 511c72c5 that entered the group one second earlier). A cancelled lane leaves
# the required check `cancelled`, the `CI Strict` aggregator polls it as
# pending for 60 minutes, times out, and the pull request is blocked even
# though nothing is wrong with its code.
#
# Keying the group on the COMMIT under verification (the pull-request head
# sha, falling back to the push sha) makes two runs for two different heads
# land in two different groups, so a new run can never be cancelled by a stale
# one: it starts immediately and reports its own check-run. `cancel-in-
# progress: false` is deliberate -- with per-commit groups the only runs that
# can share a group are duplicates of the SAME commit, and letting both run
# (rather than cancelling one) guarantees the check-run is reported (see the
# CONCURRENCY note in ci-strict.yml for the full rationale).
concurrency:
  group: sonarcloud-${{ github.event_name }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  sonarcloud:
    # The job NAME is a public contract: it is the status-check context a branch
    # protection rule pins. Keep it exactly "SonarCloud analysis".
    name: SonarCloud analysis
    runs-on: ubuntu-latest
    # The scan takes a few minutes; the bound keeps a hung docker pull or scanner
    # from holding the required check open forever.
    timeout-minutes: 30
    env:
      # Job-scoped so no unrelated job can receive it. Never echo or print this.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: https://sonarcloud.io

    steps:
      # The credential check decides between the two uncredentialed outcomes
      # BEFORE anything else runs (see the CONTRACT above): a context where
      # GitHub itself withholds repository secrets keeps the green-with-notice
      # path; every other context fails CLOSED, because `SonarCloud analysis`
      # is a required check and a required check must never be green without an
      # analysis. Until the SONAR_TOKEN repository secret is configured, the
      # soft path still keeps an un-onboarded repository's queue unblocked —
      # but only in the contexts GitHub genuinely cannot credential.
      - name: Check SONAR_TOKEN availability
        id: sonar_guard
        run: |
          withheld=false
          withheld_reason=""
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ] && [ -f "${GITHUB_EVENT_PATH}" ]; then
            # A same-repository pull request always carries
            # .pull_request.head.repo.full_name == GITHUB_REPOSITORY; anything
            # else (a fork head, or a head whose repository was deleted) is a
            # context GitHub withholds repository secrets from.
            head_repo=$(jq -r '.pull_request.head.repo.full_name // empty' "${GITHUB_EVENT_PATH}" 2>/dev/null || true)
            if [ "${head_repo}" != "${GITHUB_REPOSITORY}" ]; then
              withheld=true
              withheld_reason="the pull-request head is outside this repository (${head_repo:-head repository unavailable})"
            else
              author=$(jq -r '.pull_request.user.login // empty' "${GITHUB_EVENT_PATH}" 2>/dev/null || true)
              # The bot logins contain literal brackets: quote them, or the
              # case pattern reads [bot] as a character class and never matches.
              case "${author}" in
                'dependabot[bot]'|'renovate[bot]')
                  withheld=true
                  withheld_reason="the pull request is authored by ${author}"
                  ;;
              esac
            fi
          fi
          echo "withheld=${withheld}" >> "$GITHUB_OUTPUT"
          if [ -n "${SONAR_TOKEN}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          elif [ "${withheld}" = "true" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "reason=${withheld_reason}" >> "$GITHUB_OUTPUT"
          else
            {
              echo "### SonarCloud analysis — failed closed (no credentials in a context that must have them)"
              echo ""
              echo "The \`SONAR_TOKEN\` secret is absent in a context where it is always injectable"
              echo "(a same-repository pull request, a push to \`main\`, a merge-group validation,"
              echo "or a manual run)."
              echo "\`SonarCloud analysis\` is a REQUIRED check in the \`main\` ruleset: reporting"
              echo "green here would certify an analysis that never ran. Restore the secret"
              echo "(Settings → Secrets and variables → Actions → \`SONAR_TOKEN\`; setup"
              echo "checklist: docs/security/sonarcloud.md, section 3) and re-run this job."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::SONAR_TOKEN is absent in a context that must have it — failing closed instead of certifying an analysis that never ran (docs/security/sonarcloud.md, section 2)."
            exit 1
          fi

      # Checkout runs on the credentialed path and the withheld-credentials
      # path, so the unconfigured-state step below can still write a step
      # summary and the job keeps a deterministic conclusion. (On the
      # fail-closed path the guard has already concluded the job red before
      # any checkout was needed.)
      - name: Checkout
        # actions/checkout v7.0.1 -- the Node.js 24 runtime line, and the pin the
        # reference repository `Zeflous/zef-framework` uses for this same lane.
        # v4.4.0 was tried first and is NOT enough: every v4 release (and v5's
        # predecessor line) declares `using: node20` in its action.yml, so GitHub
        # forced it onto Node.js 24 and the run still logged
        # `##[warning]Node.js 20 is deprecated ... actions/checkout@<sha>`
        # (runs 37724920801 with v4.3.1 and 37727041126 with v4.4.0). v7.0.1
        # declares `using: node24`, so the warning is gone with the full
        # 40-character SHA pin intact.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: Report unconfigured state (credentials withheld in this context)
        if: steps.sonar_guard.outputs.available != 'true' && steps.sonar_guard.outputs.withheld == 'true'
        env:
          WITHHELD_REASON: ${{ steps.sonar_guard.outputs.reason }}
        run: |
          {
            echo "### SonarCloud analysis — skipped (no credentials in this context)"
            echo ""
            echo "No credentialed SonarCloud analysis ran for this commit: GitHub withholds"
            echo "repository secrets in this context (${WITHHELD_REASON}). The check"
            echo "reports green so a context that cannot be credentialed cannot block the"
            echo "pull request queue. In every other context (a same-repository pull"
            echo "request, a push to \`main\`, a merge-group validation, a manual run) an"
            echo "absent \`SONAR_TOKEN\` now fails closed — see docs/security/sonarcloud.md,"
            echo "section 2."
            echo ""
            echo "Setup checklist: docs/security/sonarcloud.md, section 3."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::SONAR_TOKEN withheld in this context (${WITHHELD_REASON}) — SonarCloud analysis skipped (setup: docs/security/sonarcloud.md)."

      # COVERAGE BRIDGE v2 (2026-10-08). This job installs NO dependencies and
      # runs NO tests. The analysis needs SOURCE plus a coverage report, and
      # sonar-project.properties derives no path from vendor/ (it is excluded
      # from the analysis scope). The report is taken from the CI Coverage lane
      # (`ci-coverage.yml`), which publishes the `coverage-reports` artifact
      # (clover + JUnit) for the same commit -- the same `checkout -> download
      # artifact -> sonar-scanner` shape as the reference repository
      # `Zeflous/zef-framework`. That lane has its own workflow since the heavy
      # lanes were split apart, so the bridge polls it directly instead of the
      # former combined `CI Strict` workflow.
      #
      # v1 kept a `composer install` + PHPUnit step for the push-to-main path (to
      # be the artifact's producer). That was both redundant -- the CI Coverage
      # lane already produces the artifact -- and broken: the step ran on the
      # runner's default PHP 8.3.6 while composer.lock requires PHP >=8.4
      # (`phpunit/php-code-coverage 14.4.1`), so every push-to-main run failed
      # with "Your lock file does not contain a compatible set of packages"
      # (run 37723034605). Removing the step removes the failure and the
      # duplicated dependency download (the site of the transient
      # `codeload.github.com` HTTP/2 429 rate-limit failure, run 37721082020).
      - name: Wait for the CI Coverage lane and fetch its coverage artifact (bridge)
        # Runs on EVERY credentialed event. The required SonarCloud check must
        # never certify a scan without the coverage evidence its quality gate
        # expects: a missing/failed lane, missing artifact, failed download, or
        # invalid Clover report is a hard failure, never a global exclusion.
        if: steps.sonar_guard.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail

          # Resolve the commit whose CI Coverage run publishes the artifact.
          # pull_request workflows are reported on the PR HEAD; merge_group
          # already uses the combined queue head. Manual runs resolve the ref.
          sha="${GITHUB_SHA}"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ] && [ -f "${GITHUB_EVENT_PATH}" ]; then
            pr_head=$(jq -r '.pull_request.head.sha // empty' "${GITHUB_EVENT_PATH}" 2>/dev/null || true)
            if [ -n "${pr_head}" ]; then sha="${pr_head}"; fi
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            api_sha=$(curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_REF_NAME}" \
              | jq -r '.sha // empty' 2>/dev/null || true)
            if [ -n "${api_sha}" ]; then sha="${api_sha}"; fi
          fi
          echo "Bridging coverage for reported head sha ${sha:0:8} (event: ${GITHUB_EVENT_NAME})."

          # CI Coverage has a 20-minute timeout. Wait only within that bound;
          # failure to observe a successful completed run is missing evidence.
          deadline=$(( $(date +%s) + 20 * 60 ))
          run_id=""
          status="missing"
          conclusion=""
          while [ "$(date +%s)" -lt "${deadline}" ]; do
            run_id=$(curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/ci-coverage.yml/runs?head_sha=${sha}&per_page=1" \
              | jq -r '.workflow_runs[0].id // empty' 2>/dev/null) || run_id=""
            if [ -n "${run_id}" ]; then
              run_json=$(curl -fsSL \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" 2>/dev/null) || run_json=""
              status=$(printf '%s' "${run_json}" | jq -r '.status // "unknown"' 2>/dev/null) || status="unknown"
              conclusion=$(printf '%s' "${run_json}" | jq -r '.conclusion // empty' 2>/dev/null) || conclusion=""
              if [ "${status}" = "completed" ]; then break; fi
              echo "CI Coverage run ${run_id} for ${sha:0:8}: ${status}; polling again in 20s..."
            fi
            sleep 20
          done

          if [ -z "${run_id}" ] || [ "${status}" != "completed" ]; then
            echo "::error::CI Coverage did not complete successfully within 20 minutes for ${sha:0:8}; refusing to run SonarCloud without coverage evidence."
            exit 1
          fi
          if [ "${conclusion}" != "success" ]; then
            echo "::error::CI Coverage run ${run_id} concluded '${conclusion:-unknown}' for ${sha:0:8}; refusing to run SonarCloud without successful coverage evidence."
            exit 1
          fi

          # Artifact listing can briefly lag the run's completed state. Retry
          # for at most two minutes (inside this job's 30-minute budget), then
          # fail visibly rather than excluding coverage.
          artifact_deadline=$(( $(date +%s) + 2 * 60 ))
          findings="[]"
          while [ "$(date +%s)" -lt "${artifact_deadline}" ]; do
            findings=$(curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" \
              | jq -c '[.artifacts[] | select(.name == "coverage-reports" and .expired == false)]' 2>/dev/null) || findings="[]"
            if [ "${findings}" != "[]" ] && [ -n "${findings}" ]; then break; fi
            echo "coverage-reports artifact for run ${run_id} is not visible yet; retrying in 10s..."
            sleep 10
          done
          if [ "${findings}" = "[]" ] || [ -z "${findings}" ]; then
            echo "::error::CI Coverage run ${run_id} succeeded but no unexpired coverage-reports artifact appeared within two minutes; refusing to bypass SonarCloud coverage."
            exit 1
          fi

          artifact_id=$(printf '%s' "${findings}" | jq -r '.[0].id // empty')
          if [ -z "${artifact_id}" ]; then
            echo "::error::Could not resolve the coverage-reports artifact ID for run ${run_id}."
            exit 1
          fi

          rm -rf build && mkdir -p build
          if ! curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -o build/coverage-reports.zip \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip"; then
            echo "::error::Could not download coverage-reports artifact ${artifact_id}; refusing to bypass SonarCloud coverage."
            exit 1
          fi
          if ! unzip -o -q build/coverage-reports.zip -d build; then
            echo "::error::coverage-reports artifact ${artifact_id} is not a readable ZIP archive."
            exit 1
          fi
          if [ ! -s build/clover.xml ] || ! grep -q '<coverage' build/clover.xml 2>/dev/null; then
            echo "::error::coverage-reports artifact ${artifact_id} has no valid build/clover.xml report."
            exit 1
          fi

          args="-Dsonar.php.coverage.reportPaths=build/clover.xml"
          [ ! -s build/junit.xml ] || args="${args} -Dsonar.php.tests.reportPaths=build/junit.xml"
          {
            echo "### Coverage bridge"
            echo ""
            echo "- verdict: **bridged**"
            echo "- Consumed the successful CI Coverage run ${run_id}'s `coverage-reports` artifact; the SonarCloud coverage-on-new-code condition is evaluated against real Clover data."
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "COVERAGE_ARGS=${args}" >> "${GITHUB_ENV}"

      - name: Resolve the queue-path SonarCloud branch (per entry)
        # A group of N queued entries runs N of these scans CONCURRENTLY, one
        # per cumulative group head, and a group rebuild starts them all at
        # once. A single shared branch name made those concurrent submissions
        # fight over one SonarCloud branch: the server-side compute-engine
        # task that lost the race died with "CE Task finished abnormally with
        # status: FAILED" (2026-10-18, the first-entry drill: entries #448 and
        # #449 started their scans within seconds of each other after a group
        # rebuild, and the loser's required check went red while the winner
        # went green on the same branch). The branch is therefore named PER
        # ENTRY, derived from the queue ref itself
        # (gh-readonly-queue/main/pr-449-<sha> -> merge-queue/pr-449):
        # concurrent entries can never collide, retries of the same entry
        # re-analyse their own branch in place, and the branches expire as
        # short-lived like every other queue-path analysis.
        if: github.event_name == 'merge_group' && steps.sonar_guard.outputs.available == 'true'
        run: |
          set -euo pipefail
          # gh-readonly-queue/main/pr-<N>-<40 hex> -> merge-queue/pr-<N>
          if [[ "${GITHUB_REF_NAME}" =~ ^gh-readonly-queue/main/pr-([0-9]+)-[0-9a-f]{40}$ ]]; then
            echo "QUEUE_SONAR_BRANCH=merge-queue/pr-${BASH_REMATCH[1]}" >> "$GITHUB_ENV"
          else
            # Fail closed: an unparsable queue ref must not silently fall back
            # to a shared branch name -- that is the collision this step exists
            # to prevent.
            echo "::error::Unparsable merge-group ref '${GITHUB_REF_NAME}' -- refusing to scan a shared SonarCloud branch."
            exit 1
          fi

      - name: Analysis scope (diagnostic)
        if: steps.sonar_guard.outputs.available == 'true'
        run: |
          {
            echo "### Analysis scope (diagnostic)"
            echo ""
            echo "- tracked files in the checkout: $(git ls-files | wc -l)"
            echo "- src/ PHP files: $(git ls-files 'src/*.php' | wc -l)"
            echo "- tests/ PHP files: $(git ls-files 'tests/*.php' | wc -l)"
            echo ""
            echo "If a scan reports coverage or new-code counts far outside the src/"
            echo "figures above, the exclusion allow-list in sonar-project.properties"
            echo "has drifted — see docs/security/sonarcloud.md section 4."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: SonarCloud scan
        if: steps.sonar_guard.outputs.available == 'true'
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        with:
          # Pass the base dir explicitly (parity with the reference repository);
          # the properties file restates it so a local `sonar-scanner` run
          # behaves identically. When a `pr_number` input is supplied (a manual
          # run for a PR whose `pull_request` event never fired), pass the
          # pull-request context explicitly so the analysis is attached to that
          # PR and the ruleset's `code_quality` rule can read it. On a
          # `merge_group` event the scan pins a SHORT-LIVED, PER-ENTRY SonarCloud
          # branch (`merge-queue/pr-<N>`, resolved from the queue ref by the
          # step above): the ref the group actually runs on
          # (gh-readonly-queue/main/pr-N-...) is single-use and would otherwise
          # accumulate throwaway long-lived branches in SonarCloud, while a
          # per-entry branch is re-analysed in place on every retry of that
          # entry and expires as a short-lived branch -- and two concurrent
          # entries of one group can never collide on it (a shared name made
          # their server-side compute-engine tasks race, 2026-10-18).
          # `sonar.qualitygate.wait=true` still makes the job wait for the
          # server-side verdict on that branch, so the queue path enforces the
          # same server-side quality gate.
          args: >-
            -Dsonar.projectBaseDir=.
            ${{ env.COVERAGE_ARGS }}
            ${{ github.event_name == 'merge_group' && format('-Dsonar.branch.name={0}', env.QUEUE_SONAR_BRANCH) || '' }}
            ${{ inputs.pr_number != '' && format('-Dsonar.pullrequest.key={0} -Dsonar.pullrequest.branch={1} -Dsonar.pullrequest.base=main', inputs.pr_number, github.ref_name) || '' }}
        env:
          # Reported to SonarCloud for the SCM/CI sensor. Decoration itself is
          # delivered by the SonarCloud GitHub App, not by this workflow.
          # The built-in workflow token is sufficient — no PAT is required.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          COVERAGE_ARGS: ${{ env.COVERAGE_ARGS }}
