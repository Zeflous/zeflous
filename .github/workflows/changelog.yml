# Changelog API lane: keeps a per-version, machine-readable changelog in sync
# with the pull requests that have actually been merged.
#
# WHAT IT PRODUCES
# ----------------
#   * `CHANGELOG-vX.Y.Z.md`      -- ONE FILE PER RELEASE VERSION. Each merged
#     PR is one block: the PR number + title, then the commits that belong to
#     that PR (short SHA + subject). `CHANGELOG-unreleased.md` holds the PRs
#     merged after the newest RELEASE (or every PR when no release exists yet).
#   * `CHANGELOG.md`             -- a LIGHTWEIGHT INDEX only: a table of links
#     to each per-version file. It never carries the full history, so it cannot
#     grow without bound as PRs accumulate.
#   * `docs/api/changelog.json`  -- the "changelog API": a static JSON document
#     (served as-is from the repository, raw.githubusercontent.com, or GitHub
#     Pages) that tooling can consume. Each entry carries the `file` it lives
#     in and its `commits` (short SHA + subject).
#   * `docs/api/changelog-index.json` -- a small discovery index (version ->
#     file, counts, latest release).
#
# All are generated by `scripts/changelog/generate.py` from the merged pull
# requests, their commits, and the repository tags, so the artifacts can never
# disagree.
#
# MERGED-ONLY
# -----------
#   * Only pull requests that were actually MERGED into `main` are included.
#     A PR closed WITHOUT being merged, a draft PR, and a PR merged into a
#     non-default branch are all excluded explicitly -- they never changed
#     `main`, so they must not appear in the changelog.
#   * This workflow runs ONLY on `push` to `main` (what a merge produces) and
#     on `workflow_dispatch`. There is deliberately no `pull_request` trigger,
#     so a changelog can never be produced before a PR has landed. The
#     generator's own test suite runs on pull requests in the separate,
#     read-only `.github/workflows/changelog-tests.yml`.
#
# HOW IT ACCUMULATES PER VERSION
# ------------------------------
#   * Every merged PR becomes one entry: number, title, author, category
#     (feat/fix/chore/docs/...), merge date, and the release version it belongs
#     to. The version is decided by the project's RELEASES, not by raw git
#     tags: the source of truth is the GitHub Releases API, and a PR belongs to
#     the FIRST published release at or after its merge time. PRs merged after
#     the newest release land under `Unreleased`; a draft release is surfaced
#     only as the `next_release` hint, never as a bucket. Git tags are used
#     ONLY as a fallback when the repository has no published releases at all.
#     The chosen source is recorded in the JSON as `version_source`
#     (`github_release` / `git_tag` / `none`).
#   * The category taxonomy is read from `.github/release-drafter.yml` -- the
#     SAME file Release Drafter uses -- so there is no second, drifting copy of
#     the label->category mapping. A PR with no matching label is categorised
#     from its Conventional-Commit type (`feat:`/`fix:`/`docs:`/`chore:`/
#     `refactor:`/`perf:`/`test:`/`ci:`/`build:`/`style:`/`revert:`/`security:`)
#     via a regex, mapped onto those SAME configured titles, so a regex-derived
#     category can never conflict with a label-derived one. Release Drafter
#     keeps the draft release notes; this lane keeps the machine-readable,
#     per-version changelog.
#
# WHY THE UPDATE GOES THROUGH A PULL REQUEST (not a direct commit to `main`)
# --------------------------------------------------------------------------
# The `main` branch ruleset requires every change to arrive through a pull
# request (`pull_request` rule) and requires the `CI Strict` status check. A
# direct push to `main` is rejected with
# `422 Repository rule violations found / Changes must be made through a pull
# request` -- verified against this repository. The update job therefore opens
# a pull request carrying the regenerated files and arms GitHub's native
# auto-merge on it, so the change lands itself once the required check is
# green. It never merges by hand.
#
# IDEMPOTENT
# ----------
#   * The output is a pure function of (merged PRs, tags, config). Re-running
#     never duplicates an entry: entries are de-duplicated by PR number within
#     a version and the whole document is rebuilt deterministically.
#   * The update job opens a pull request only when the regenerated files
#     actually differ, so a re-run on an unchanged repository is a no-op.
#   * A SINGLE stable update branch (`chore/changelog-update`) is reused: if a
#     changelog pull request is already open, the new commit is pushed onto it
#     instead of opening a second one. Repeated runs therefore converge on one
#     pull request rather than accumulating duplicates.
#   * The changelog automation's own pull requests are excluded from the
#     changelog (see `CHANGELOG_PR_PREFIX` in the generator), so the document
#     never describes its own maintenance and cannot grow on every cycle.
#
# CONVENTIONS
# -----------
#   * Every `uses:` is pinned to a FULL 40-character commit SHA with the
#     original tag kept as a trailing comment. Tag/branch refs are what
#     SonarCloud flags as `githubactions:S7637`; pinning keeps supply-chain
#     findings at zero without any rule exclusion.
#   * Least privilege: `contents: read` at the workflow level; only the job
#     that opens the update pull request gets `contents: write` +
#     `pull-requests: write`.
#   * The built-in `GITHUB_TOKEN` is used -- no PAT. The token is referenced by
#     NAME only; its value is never written to a file, log, or artifact.

name: Changelog

on:
  # ONLY after a merge: a push to `main` is what a merged pull request
  # produces. The changelog must never be generated before a PR has landed, so
  # there is deliberately NO `pull_request` trigger here. The generator's own
  # test suite runs on pull requests in the separate, read-only
  # `.github/workflows/changelog-tests.yml`.
  push:
    branches:
      - main
  # Manual re-run (idempotent) to refresh the changelog without waiting for a push.
  workflow_dispatch:

# Baseline: no write authority at the workflow level.
permissions:
  contents: read

# One run at a time; a queued run proceeds after the current one instead of
# being dropped, so two quick merges cannot race over the same update branch.
concurrency:
  group: changelog
  cancel-in-progress: false

jobs:
  update:
    name: Update changelog
    # Skip the run caused by the automation's own merge commit, so the lane
    # cannot chase its own tail. This workflow only runs on push to `main` and
    # on manual dispatch, so there is no pull_request event to guard against.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write      # push the update branch
      pull-requests: write # open the update pull request + arm auto-merge
      actions: write       # dispatch the required checks on the update branch
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.11'

      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml

      - name: Regenerate changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/changelog/generate.py

      - name: Open or update the changelog pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Every file the generator owns: the index, the JSON API, the JSON
          # index, and one markdown file per release version.
          if git diff --quiet -- CHANGELOG.md 'CHANGELOG-*.md' docs/api/changelog.json docs/api/changelog-index.json; then
            echo "Changelog already up to date -- nothing to do."
            exit 0
          fi

          # One stable branch: a re-run updates the same pull request instead of
          # opening a second one.
          branch="chore/changelog-update"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add CHANGELOG.md 'CHANGELOG-*.md' docs/api/changelog.json docs/api/changelog-index.json
          # NOTE: no `[skip ci]` here on purpose. The commit is pushed with the
          # built-in `GITHUB_TOKEN`, and `[skip ci]` would suppress the
          # `pull_request` event entirely, so the required `CI Strict` check
          # would never be created for this PR and auto-merge would wait
          # forever. Without it the push fires `pull_request`; the run is left
          # `action_required` (bot-authored push) and `auto-merge.yml` approves
          # it on its next sweep so the check can turn green.
          git commit -m "chore(changelog): regenerate API changelog"
          git push -f -u origin "$branch"

          # Reuse an open pull request for this branch if one exists; otherwise
          # open it. `gh pr view` exits non-zero when there is no PR.
          if gh pr view "$branch" --json state --jq '.state' 2>/dev/null | grep -q OPEN; then
            echo "Updated the existing changelog pull request."
          else
            gh pr create \
              --base main \
              --head "$branch" \
              --title "chore(changelog): regenerate API changelog" \
              --body "Automated regeneration of the per-version changelog files (\`CHANGELOG-vX.Y.Z.md\` / \`CHANGELOG-unreleased.md\`), the \`CHANGELOG.md\` index, and the JSON API (\`docs/api/changelog.json\` + \`docs/api/changelog-index.json\`) from the merged pull requests. Generated by \`.github/workflows/changelog.yml\`; no hand edits."
          fi

          # A push made with the built-in `GITHUB_TOKEN` does NOT trigger other
          # workflows (GitHub's recursion guard), so the required `CI Strict`
          # check would never appear on this branch and auto-merge would wait
          # forever. Dispatch the required workflows explicitly on the update
          # branch so the checks run and the pull request can merge itself.
          pr_number=$(gh pr view "$branch" --json number --jq '.number')
          gh workflow run ci-strict.yml --ref "$branch" \
            && echo "Dispatched ci-strict.yml on $branch." \
            || echo "::warning::Could not dispatch ci-strict.yml on $branch."
          # SonarCloud is dispatched with the PR number so the analysis is
          # attached to this pull request (the ruleset's `code_quality` rule
          # reads it; without an analysis the merge stays blocked).
          gh workflow run sonarcloud.yml --ref "$branch" -f pr_number="$pr_number" \
            && echo "Dispatched sonarcloud.yml on $branch for PR #$pr_number." \
            || echo "::warning::Could not dispatch sonarcloud.yml on $branch."

          # Arm GitHub's native auto-merge: the change lands itself once the
          # required `CI Strict` check is green. Never merged by hand.
          gh pr merge "$branch" --auto --squash || \
            echo "::warning::Could not arm auto-merge on the changelog PR; it will be merged by the auto-merge sweep once green."
