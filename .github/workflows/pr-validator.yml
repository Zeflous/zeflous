# PR Validator -- the pull-request title gate.
#
# WHY THIS GATE EXISTS
# --------------------
# The changelog generator categorises a merged PR from its Conventional-Commit
# type (`feat:` -> Features, `fix:` -> Bug Fixes, ...). A PR whose title is not
# a Conventional-Commit header cannot be categorised, so it silently lands in
# "Other" and the release notes lose signal. This gate makes the convention
# ENFORCED at the pull request instead of discovered after the merge: a title
# that does not match the taxonomy fails the check.
#
# SINGLE SOURCE OF TRUTH
# ----------------------
# The accepted types and the header regex are NOT re-declared here. The job
# imports `scripts/changelog/conventional.py` -- the very module the changelog
# generator imports -- so the gate and the changelog can never disagree about
# what a valid title is. Adding a type in one place changes both.
#
# CONVENTIONS (mirrors the other lanes)
# -------------------------------------
#   * Every `uses:` is pinned to a FULL 40-character commit SHA with the
#     original tag kept as a trailing comment. Tag/branch refs are what
#     SonarCloud flags as `githubactions:S7637`; pinning keeps supply-chain
#     findings at zero without any rule exclusion.
#   * Least privilege: the job only reads the repository and the pull request.
#   * The built-in `GITHUB_TOKEN` is used -- no PAT. The token is referenced by
#     NAME only; its value is never written to a file, log, or artifact.
#   * The job NAME "PR Validator" is the status-check context. It is a required
#     status check on `main`; keep it exactly "PR Validator".

name: PR Validator

on:
  pull_request:
    branches:
      - main
    # `edited` re-runs the gate when the title is fixed, so a corrected title
    # turns the check green without a new commit.
    types: [opened, edited, synchronize, reopened]
  # MERGE QUEUE: a `merge_group` event carries no pull-request title, but the
  # group's branch name embeds the number of the pull request being validated
  # (gh-readonly-queue/main/pr-<N>-<sha>). The queue path resolves that pull
  # request through the API and validates its title against the same taxonomy,
  # so a title that would fail the pull-request path also fails the queue path
  # (fail closed -- a group whose pull request cannot be resolved is rejected,
  # not waved through).
  merge_group:
    branches:
      - main
  # Manual run. A title can be supplied for a dry-run; without one the job
  # reports that there is nothing to validate and passes.
  workflow_dispatch:
    inputs:
      title:
        description: 'PR title to validate (optional; for a manual dry-run)'
        required: false
        type: string

# Least privilege: read the repository and the pull request; write nothing.
permissions:
  contents: read
  pull-requests: read

# One run at a time per pull request; a queued run proceeds after the current
# one instead of being dropped (a title edit must not cancel a pending run).
concurrency:
  group: pr-validator-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pr-validator:
    # The job NAME is a public contract: it is the status-check context pinned
    # by the `main` ruleset. Keep it exactly "PR Validator".
    name: PR Validator
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      # MERGE QUEUE PATH: `github.event.pull_request.title` is empty on a
      # `merge_group` event, so the title is recovered from the pull request
      # whose number the merge-group branch name carries. Every failure mode
      # (an unparsable ref, an API failure, an empty title) fails the job: the
      # queue path must never validate "nothing".
      - name: Resolve the queued pull request's title
        if: github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          number=$(printf '%s' "${GITHUB_REF_NAME}" \
            | sed -n 's|^gh-readonly-queue/main/pr-\([0-9][0-9]*\)-.*$|\1|p')
          if [ -z "${number}" ]; then
            echo "::error::The merge-group ref '${GITHUB_REF_NAME}' carries no pull-request number -- the queued title cannot be validated (fail closed)."
            exit 1
          fi
          title=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${number}" --jq '.title' 2>/dev/null) || {
            echo "::error::Could not read pull request #${number} -- the queued title cannot be validated (fail closed)."
            exit 1
          }
          if [ -z "${title}" ]; then
            echo "::error::Pull request #${number} carries an empty title -- the queued title cannot be validated (fail closed)."
            exit 1
          fi
          # A per-run random delimiter: GitHub titles may contain newlines,
          # and a fixed delimiter the title can spell would terminate the
          # heredoc early and let the remainder parse as further $GITHUB_ENV
          # directives (the documented contract: the delimiter must not
          # appear in the value).
          delimiter="QUEUE_PR_TITLE_EOF_${RANDOM}${RANDOM}"
          {
            echo "QUEUE_PR_TITLE<<${delimiter}"
            printf '%s' "${title}"
            echo ""
            echo "${delimiter}"
          } >> "$GITHUB_ENV"
          echo "Merge-group path: validating the title of pull request #${number}."

      - name: Validate the pull-request title
        # The title is passed through the environment (never interpolated into
        # the shell), so a title containing shell metacharacters cannot inject a
        # command. The validator imports the shared taxonomy module, so the
        # accepted types are exactly the changelog's. On the merge-group path
        # the resolved queued title (QUEUE_PR_TITLE) feeds the same validator.
        env:
          PR_TITLE: ${{ github.event.pull_request.title || inputs.title || env.QUEUE_PR_TITLE || '' }}
        run: |
          if [ -z "$PR_TITLE" ]; then
            echo "::notice::No pull-request title to validate (manual run without a title input)."
            exit 0
          fi
          python3 scripts/changelog/conventional.py --title "$PR_TITLE"
