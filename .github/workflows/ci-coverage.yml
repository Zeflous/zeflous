# Strict CI lane -- line-coverage gate (needs pcov) + coverage report producer.
#
# SPLIT OUT OF `.github/workflows/ci-strict.yml` (2026-10-08), for the same
# reason as `ci-static.yml`: one lane's failure no longer entangles the others
# and this lane can be retried on its own.
#
# This lane is also the SOLE PRODUCER of the `coverage-reports` artifact
# (clover + JUnit) that the SonarCloud lane bridges for its coverage-on-new-code
# condition, so it is the only lane whose runs the scanner waits for.
#
# The job NAME below ("CI Coverage") is the status-check context -- keep it
# stable.

name: CI Coverage

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
  workflow_dispatch:

# Least privilege: the lane reads the repository; it writes no repository state.
permissions:
  contents: read

# NEVER CANCEL A RUN OF A DIFFERENT HEAD -- KEY THE GROUP PER COMMIT
# (fixed 2026-10-10, mirrors ci-strict.yml). On a `pull_request` event
# `github.ref` is the ephemeral merge ref `refs/pull/N/merge`, which MUTATES
# whenever the pull request is updated: two runs for two different heads share
# one group, and GitHub's `cancel-in-progress` is a best-effort, unordered
# cancellation -- the NEWEST run is sometimes the victim (observed on PR #136:
# the lane runs for head 92f182e0 were cancelled by a run for the older head
# 511c72c5 that entered the group one second earlier). A cancelled lane leaves
# the required check `cancelled`, the `CI Strict` aggregator polls it as
# pending for 60 minutes, times out, and the pull request is blocked even
# though nothing is wrong with its code.
#
# Keying the group on the COMMIT under verification (the pull-request head
# sha, falling back to the push sha) makes two runs for two different heads
# land in two different groups, so a new run can never be cancelled by a stale
# one: it starts immediately and reports its own check-run. `cancel-in-
# progress: false` is deliberate -- with per-commit groups the only runs that
# can share a group are duplicates of the SAME commit, and letting both run
# (rather than cancelling one) guarantees the check-run is reported (see the
# CONCURRENCY note in ci-strict.yml for the full rationale).
concurrency:
  group: ci-coverage-${{ github.event_name }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  # Line-coverage gate (needs pcov).
  ci-coverage:
    name: CI Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP 8.4 with pcov
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: pcov
          coverage: pcov
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run coverage gate (composer ci:coverage)
        run: composer ci:coverage

      - name: Regenerate coverage reports (clover + JUnit)
        # ci:coverage runs the gate variant, which writes build/clover.xml but
        # does not emit the JUnit report. This script (composer ci:coverage:reports)
        # reruns PHPUnit with both report writers so the SonarCloud job can
        # download a complete report set instead of installing dependencies and
        # rerunning the suite itself. The gate above already enforced the 90%
        # floor, so a failure here is a real signal, not a budget artefact.
        run: composer ci:coverage:reports

      - name: Upload coverage reports
        # Consumed by the SonarCloud job's coverage bridge (it fetches this
        # artifact by name for the same commit). Published AFTER the gate so a
        # failed coverage lane never feeds a phantom report to the scanner.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-reports
          path: |
            build/clover.xml
            build/junit.xml
          if-no-files-found: error
          retention-days: 14
