# Strict CI lane -- line-coverage gate (needs pcov).
#
# SPLIT OUT OF `.github/workflows/ci-strict.yml` (2026-10-08), for the same
# reason as `ci-static.yml`: one lane's failure no longer entangles the others
# and this lane can be retried on its own.
#
# (2026-10-26) The `coverage-reports` artifact and the report-regeneration
# step this lane used to carry existed solely to feed the SonarCloud lane's
# coverage bridge; both went with that lane's retirement. The gate variant
# (`composer coverage:gate`) still writes build/clover.xml + build/junit.xml
# for local inspection, but nothing consumes them from CI anymore.
#
# The job NAME below ("CI Coverage") is the status-check context -- keep it
# stable.

name: CI Coverage

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  # MERGE QUEUE: the `main` ruleset's merge queue re-runs the required checks
  # on the merge group's head sha (refs/heads/gh-readonly-queue/main/pr-N-...)
  # using the DEFAULT BRANCH's workflow files, so the queue validates the
  # merged result rather than the pull request's own workflow version
  # (docs/ci-notes/merge-gate-audit.md, finding 3). Without this trigger the
  # queue would wait for this lane until the ruleset's check-response timeout,
  # then fail the entry.
  merge_group:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

# Least privilege: the lane reads the repository; it writes no repository state.
permissions:
  contents: read

# NEVER CANCEL A RUN OF A DIFFERENT HEAD -- KEY THE GROUP PER COMMIT
# (fixed 2026-10-10, mirrors ci-strict.yml). On a `pull_request` event
# `github.ref` is the ephemeral merge ref `refs/pull/N/merge`, which MUTATES
# whenever the pull request is updated: two runs for two different heads share
# one group, and GitHub's `cancel-in-progress` is a best-effort, unordered
# cancellation -- the NEWEST run is sometimes the victim (observed on PR #136:
# the lane runs for head 92f182e0 were cancelled by a run for the older head
# 511c72c5 that entered the group one second earlier). A cancelled lane leaves
# the required check `cancelled`, the `CI Strict` aggregator polls it as
# pending for 70 minutes, times out, and the pull request is blocked even
# though nothing is wrong with its code.
#
# Keying the group on the COMMIT under verification (the pull-request head
# sha, falling back to the push sha) makes two runs for two different heads
# land in two different groups, so a new run can never be cancelled by a stale
# one: it starts immediately and reports its own check-run. `cancel-in-
# progress: false` is deliberate -- with per-commit groups the only runs that
# can share a group are duplicates of the SAME commit, and letting both run
# (rather than cancelling one) guarantees the check-run is reported (see the
# CONCURRENCY note in ci-strict.yml for the full rationale).
concurrency:
  group: ci-coverage-${{ github.event_name }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  # Line-coverage gate (needs pcov).
  ci-coverage:
    name: CI Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP 8.4 with pcov
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: pcov
          coverage: pcov
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run coverage gate (composer ci:coverage)
        run: composer ci:coverage
