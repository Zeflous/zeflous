# CI Ruleset Lint -- the guard against dead required checks.
#
# WHY THIS LANE EXISTS
# --------------------
# Finding 1 of the merge-gate audit (docs/ci-notes/merge-gate-audit.md):
# the `main` ruleset required eight status-check contexts, three of them
# (DeepSource) never reported anywhere, and PR #406 merged anyway. GitHub
# only blocks a merge on a required check it considers "expected"; a context
# that has never reported is never expected, so it never blocks. The ruleset
# was repaired (evidenced on issue #420), but nothing kept a dead requirement
# from coming back -- an integration removed, an app uninstalled, a check
# renamed.
#
# This lane is the permanent guard (#420, option c): every required context
# in the LIVE `main` ruleset must have a check-run on each of the last ten
# merged pull-request heads. A required check that silently stops reporting
# turns the lane RED with the evidence, the same week it happens, instead of
# waiting for the next audit.
#
# THE CLASSIC LAYER (the round-3 documentation-alignment audit, 2026-10-23;
# consolidated the same day, issue #561)
# ----------------------------------------------------------------------
# The required set is the UNION of the active ruleset and the repository's
# classic branch-protection rule, whenever such a layer exists -- only the
# ruleset half was being linted before. As of 2026-10-23 the owner has
# consolidated the protection into the ruleset alone (GET
# /branches/main/protection answers 404 "Branch not protected"), and the
# lane reads that shape as a first-class ABSENT verdict -- no warning, no
# unaudited claim -- so the union doctrine survives the layer's return
# without the lane lying about it in either direction. The read is
# administration-scoped: the workflow token does not carry the rights, so
# the lane tries the owner's optional ZEF_TOKEN first (the arming lanes' own
# documented credential -- used here READ-ONLY), then the workflow token.
# When no credential can read a layer that might exist, the lane degrades to
# an explicit weekly WARNING naming the unaudited layer -- a warning, not a
# red lane, because the evidence is privileged by GitHub design, not missing
# by accident (the fail-closed doctrine covers evidence the token SHOULD be
# able to read; the ruleset read below is exactly that case).
#
# DESIGN NOTES
# ------------
#   * The rulesets endpoint wants administration rights no credential in
#     this lane carries except the owner's PAT: the workflow token reads
#     403, and the anonymous read is per-IP rate-limited and observed 403
#     on GitHub-hosted runners (the dispatched verification run of
#     2026-10-23 failed through both branches of the old chain -- the
#     "rulesets are readable anonymously" probe of 2026-10-18 does not
#     survive shared runner IPs). fetch() tries the PAT first, the workflow
#     token second, the anonymous read last; with no PAT the lane is RED,
#     fail-closed, exactly the doctrine the next bullet states.
#   * Fail-closed: a ruleset that cannot be read is a RED lane, not a skip.
#     A repository with no merged pull requests yet passes with a notice
#     (there is no evidence to contradict).
#   * The check-runs are read per merged HEAD sha -- the same commit the
#     merge actually gated -- so a check that reports only on push commits
#     (never on pull-request heads) is caught too. The match is by context
#     NAME, the same level the merge gate itself matches at.
#   * Weekly cadence, clear of the sweeper lanes' minutes (auto-merge
#     :07/:27/:47, watchdog :03/:23/:43, stale :13/:33/:53).
#
# CONVENTIONS (mirrors the other lanes)
# -------------------------------------
#   * No `uses:` at all -- plain gh/curl/jq, so there is no supply-chain
#     surface to pin.
#   * Least privilege: `contents: read` only; the public API reads need no
#     more, and the lane writes nothing.
#   * The job NAME "CI Ruleset Lint" is the status-check context. The lane is
#     ADVISORY (not in the required set) on purpose: it guards the ruleset,
#     and must not become part of the very surface it lints.

name: CI Ruleset Lint

on:
  schedule:
    # Mondays 05:17 UTC -- weekly, and clear of every sweeper lane's minute.
    - cron: '17 5 * * 1'
  # Manual run (e.g. right after a ruleset change, or a DeepSource-style
  # incident).
  workflow_dispatch:

# Least privilege: the lane only reads public repository metadata through the
# REST API; it writes nothing.
permissions:
  contents: read

# One run at a time; a queued run proceeds after the current one instead of
# being dropped. The group carries the commit sha (see WorkflowConcurrencyPolicy),
# which for a scheduled/dispatched run is the default branch head at launch.
concurrency:
  group: ci-ruleset-lint-${{ github.sha }}
  cancel-in-progress: false

jobs:
  ruleset-lint:
    # The job NAME is the status-check context; keep it exactly
    # "CI Ruleset Lint".
    name: CI Ruleset Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Lint the live required-check set against merged-head evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The owner's optional PAT (the arming lanes' own documented
          # credential, preferred when present): BOTH privileged reads this
          # lane makes -- the rulesets endpoint and the classic
          # branch-protection layer -- need administration rights the workflow
          # token does not carry. The lane only READS with it -- it writes
          # nothing -- and degrades to fail-closed red (ruleset) or a weekly
          # warning (classic layer) when it is absent or refused.
          OWNER_TOKEN: ${{ secrets.ZEF_TOKEN }}
          HEADS_TO_LINT: "10"
        run: |
          set -euo pipefail

          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"

          # Read one API path, credentials in order of privilege: the owner's
          # PAT first (the only credential that reads the administration-
          # scoped rulesets endpoint in practice -- the auto-merge sweep reads
          # the same endpoint with the same credential every run), the
          # workflow token second, the anonymous read last. The weaker two
          # cannot read /rulesets today (403 both, re-verified 2026-10-23 on a
          # dispatched run), but they stay in the chain so the lane
          # self-heals if the endpoint ever opens to them again.
          fetch() {
            local path="$1" out=""
            if [ -n "${OWNER_TOKEN}" ]; then
              out=$(GH_TOKEN="${OWNER_TOKEN}" gh api "repos/${GITHUB_REPOSITORY}${path}" 2>/dev/null) || out=""
            fi
            if [ -z "${out}" ]; then
              out=$(gh api "repos/${GITHUB_REPOSITORY}${path}" 2>/dev/null) || out=""
            fi
            if [ -z "${out}" ]; then
              out=$(curl -fsSL "${api}${path}" 2>/dev/null) || out=""
            fi
            printf '%s' "${out}"
          }

          # --- 1. The live `main` ruleset. --------------------------------
          # The LIST endpoint returns no `conditions` field (verified: absent
          # even with ?includes=conditions), so the candidates are resolved by
          # target and enforcement alone -- the same resolution the auto-merge
          # sweep performs -- and refs/heads/main is confirmed on each
          # candidate's DETAIL read, which is where the field actually lives.
          rulesets=$(fetch "/rulesets?per_page=100")
          id=""
          detail=""
          if printf '%s' "${rulesets}" | jq -e 'type == "array"' >/dev/null 2>&1; then
            for candidate in $(printf '%s' "${rulesets}" | jq -r \
                '[.[] | select(.target == "branch") | select(.enforcement == "active") | .id][]'); do
              candidate_detail=$(fetch "/rulesets/${candidate}")
              if printf '%s' "${candidate_detail}" | jq -e \
                  '((.conditions.ref_name.include // []) | index("refs/heads/main")) != null' >/dev/null 2>&1; then
                id="${candidate}"
                detail="${candidate_detail}"
                break
              fi
            done
          fi
          if [ -z "${id}" ]; then
            echo "::error::Could not resolve the active ruleset targeting refs/heads/main (fail closed) -- the lint cannot verify what it cannot read."
            exit 1
          fi
          contexts=$(printf '%s' "${detail}" \
            | jq -r '.rules[] | select(.type == "required_status_checks")
                      | .parameters.required_status_checks[].context')
          if [ -z "${contexts}" ]; then
            echo "::error::Ruleset ${id} carries no required_status_checks rule to lint (fail closed)."
            exit 1
          fi

          # --- 1b. The classic branch-protection layer (read-only). -------
          # The required set is the union of the ruleset and this layer,
          # whenever the layer exists. The read distinguishes three shapes:
          # a 200 (read it), a 404 "Branch not protected" (the layer is
          # definitively ABSENT -- the consolidation of issue #561 -- an
          # absence contributing no contexts and claiming nothing unaudited),
          # and any other status (a privilege gap: the weekly warning). The
          # HTTP status rides a curl -w trailer so the shapes cannot be
          # conflated -- gh api flattens all three into the same failure.
          classic_contexts=""
          classic_status="unread"
          classic_code="000"
          classic_body=""
          read_protection() {
            # $1 = the credential to read with (the PAT or the workflow
            # token). Prints "<body>\n<http-code>"; a transport failure
            # prints "\n000". Without -f, every HTTP status is a curl
            # success, so the trailer is always written.
            curl -sS --max-time 30 \
              -H "Authorization: Bearer ${1}" \
              -H "Accept: application/vnd.github+json" \
              -w '\n%{http_code}' \
              "${api}/branches/main/protection" 2>/dev/null || printf '\n000'
          }
          if [ -n "${OWNER_TOKEN}" ]; then
            classic_resp=$(read_protection "${OWNER_TOKEN}")
            classic_code="${classic_resp##*$'\n'}"
            classic_body="${classic_resp%$'\n'*}"
          fi
          if [ "${classic_code}" != "200" ] && [ "${classic_code}" != "404" ]; then
            # Not a definitive answer from the PAT (or no PAT at all): let
            # the workflow token try before declaring the layer unreadable.
            classic_resp=$(read_protection "${GH_TOKEN}")
            classic_code="${classic_resp##*$'\n'}"
            classic_body="${classic_resp%$'\n'*}"
          fi
          if [ "${classic_code}" = "404" ]; then
            classic_status="absent"
          elif [ "${classic_code}" = "200" ] \
              && printf '%s' "${classic_body}" | jq -e 'type == "object"' >/dev/null 2>&1; then
            if printf '%s' "${classic_body}" | jq -e '.required_status_checks != null' >/dev/null 2>&1; then
              classic_contexts=$(printf '%s' "${classic_body}" | jq -r '.required_status_checks.contexts[]? // empty')
              classic_status="read"
            else
              classic_status="empty"
            fi
          fi
          if [ "${classic_status}" = "unread" ]; then
            echo "::warning::The classic branch-protection layer could not be read with this lane's credentials (administration-scoped endpoint; no ZEF_TOKEN present or accepted). Its required contexts are UNAUDITED this week -- the owner's manual audit stands in."
          fi
          # Union the classic-only contexts onto the linted set. The ruleset's
          # own contexts come first so the table's order stays stable, and a
          # context both layers name is linted exactly once.
          if [ "${classic_status}" = "read" ] && [ -n "${classic_contexts}" ]; then
            while IFS= read -r ctx; do
              [ -z "${ctx}" ] && continue
              if ! printf '%s\n' "${contexts}" | grep -Fxq "${ctx}"; then
                contexts="${contexts}"$'\n'"${ctx}"
              fi
            done <<< "${classic_contexts}"
          fi

          # --- 2. The last N merged pull-request heads. -------------------
          # Paginate the full closed-PR collection before sorting by merged_at.
          # GitHub's "updated" sort is not merge chronology, and a first-page
          # slice can omit the latest merges when older PRs receive updates.
          # --paginate emits one JSON array per page; jq -s combines the pages.
          heads=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls?state=closed&sort=updated&direction=desc&per_page=100" \
            | jq -sr --argjson limit "${HEADS_TO_LINT}" '
                add
                | map(select(.merged_at != null))
                | sort_by(.merged_at)
                | reverse
                | .[:$limit]
                | .[] | [.number, .head.sha] | @tsv')
          if [ -z "${heads}" ]; then
            echo "::notice::No merged pull requests to lint yet -- nothing contradicts the required set."
            exit 0
          fi
          total_heads=$(printf '%s\n' "${heads}" | wc -l)

          # --- 3. Every required context must have reported on every head.
          # `=()` matters: under `set -u` an associative array that is only
          # declared (never assigned) reads as unbound in bash, and the
          # all-present pass case never assigns `missing` a single key.
          declare -A missing=()
          declare -A present_count=()
          while IFS=$'\t' read -r number sha; do
            # --paginate walks every page: this repository's merged heads
            # accumulate check-runs from 23 workflows plus external apps,
            # and a capped first page would report required contexts that
            # reported beyond it as missing on every head.
            names=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/commits/${sha}/check-runs?per_page=100" \
              | jq -r '.check_runs[].name')
            while IFS= read -r context; do
              if printf '%s\n' "${names}" | grep -Fxq "${context}"; then
                present_count["${context}"]=$(( ${present_count["${context}"]:-0} + 1 ))
              else
                missing["${context}"]+="#${number} "
              fi
            done <<< "${contexts}"
          done <<< "${heads}"

          # --- 4. Verdict + evidence. -------------------------------------
          case "${classic_status}" in
            read) classic_note=" united with the classic branch-protection layer" ;;
            empty) classic_note=" (the classic branch-protection layer carries no required contexts)" ;;
            absent) classic_note=" (no classic branch-protection layer exists -- the protection was consolidated into the ruleset, issue #561)" ;;
            *) classic_note=" (classic branch-protection layer UNREADABLE this week -- see the warning)" ;;
          esac
          {
            echo "### Ruleset lint"
            echo ""
            echo "Every required context of ruleset ${id} (refs/heads/main)${classic_note}"
            echo "must have a check-run on each of the last ${total_heads} merged pull-request heads."
            echo ""
            echo "| Required context | Reported on | Missing on |"
            echo "| --- | --- | --- |"
            while IFS= read -r context; do
              count=${present_count["${context}"]:-0}
              miss=${missing["${context}"]:-}
              if [ -n "${miss}" ]; then
                echo "| \`${context}\` | ${count}/${total_heads} | ${miss} |"
              else
                echo "| \`${context}\` | ${total_heads}/${total_heads} | (none) |"
              fi
            done <<< "${contexts}"
            echo ""
            if [ "${#missing[@]}" -eq 0 ]; then
              echo "**Verdict: pass** -- every required check reported on every merged head."
            else
              echo "**Verdict: FAIL** -- a required check that never reports is never"
              echo "\"expected\", so it never blocks a merge (the PR #406 failure mode)."
              echo "Remove the dead context from the ruleset, or repair the integration."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

          if [ "${#missing[@]}" -ne 0 ]; then
            dead=$(printf '%s; ' "${!missing[@]}")
            echo "::error::Required checks missing from recent merged heads: ${dead}"
            exit 1
          fi
          echo "Ruleset lint: pass."
