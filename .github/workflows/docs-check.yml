# API documentation lane: builds the API reference on every pull request, so a
# change that breaks the documentation renderer fails BEFORE merge.
#
# WHY THIS FILE EXISTS
# --------------------
# Mirrors `.github/workflows/docs-check.yml` from the reference repository
# `zeflous/zef-framework`. This repository already ships `doctum.php` and a
# `composer docs` script, and `composer ci:strict` runs everything EXCEPT the
# documentation build — so a source change that Doctum cannot parse was
# previously discovered only by whoever happened to run the docs build locally.
# This lane closes that gap: the same `composer docs` the maintainers run.
#
# CONVENTIONS (mirrors the repository's other workflows)
# ------------------------------------------------------
#   * Every `uses:` is pinned to a FULL 40-character commit SHA with the
#     original tag kept as a trailing comment. Tag/branch refs are what
#     SonarCloud flags as `githubactions:S7637`; pinning keeps the supply-chain
#     finding count at zero, with no rule exclusion and no relaxed gate.
#   * Least privilege: the job only reads the repository.
#   * Read-only: nothing is deployed from a pull request. Doctum writes to
#     `build/docs`, which is already git-ignored.

name: API Documentation Check

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  # Keep the docs build verifiable on the default branch and re-runnable after a
  # tooling update.
  push:
    branches:
      - main
  workflow_dispatch:

# Least privilege: build the documentation, write nothing back to the repo.
permissions:
  contents: read

# NEVER CANCEL A RUN OF A DIFFERENT HEAD -- KEY THE GROUP PER COMMIT
# (fixed 2026-10-10, mirrors ci-strict.yml). On a `pull_request` event
# `github.ref` is the ephemeral merge ref `refs/pull/N/merge`, which MUTATES
# whenever the pull request is updated: two runs for two different heads share
# one group, and GitHub's `cancel-in-progress` is a best-effort, unordered
# cancellation -- the NEWEST run is sometimes the victim (observed on PR #136:
# the lane runs for head 92f182e0 were cancelled by a run for the older head
# 511c72c5 that entered the group one second earlier). A cancelled lane leaves
# the required check `cancelled`, the `CI Strict` aggregator polls it as
# pending for 60 minutes, times out, and the pull request is blocked even
# though nothing is wrong with its code.
#
# Keying the group on the COMMIT under verification (the pull-request head
# sha, falling back to the push sha) makes two runs for two different heads
# land in two different groups, so a new run can never be cancelled by a stale
# one: it starts immediately and reports its own check-run. `cancel-in-
# progress: false` is deliberate -- with per-commit groups the only runs that
# can share a group are duplicates of the SAME commit, and letting both run
# (rather than cancelling one) guarantees the check-run is reported (see the
# CONCURRENCY note in ci-strict.yml for the full rationale).
concurrency:
  group: docs-check-${{ github.event_name }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  docs-check:
    # The job NAME is a public contract: it is the status-check context a branch
    # protection rule would pin. Keep it exactly "API Documentation Check".
    name: API Documentation Check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Build API documentation (Doctum)
        # `composer docs` -> `vendor/bin/doctum.php update doctum.php`; the build
        # directory comes from doctum.php (build_dir => build/docs).
        run: composer docs

      - name: Verify documentation output
        shell: bash
        run: |
          set -euo pipefail

          # Fail-closed: a missing or empty entry point means the documentation
          # build is broken, which is precisely what this lane exists to catch.
          if [ ! -s build/docs/index.html ]; then
            echo "::error::Doctum produced no build/docs/index.html - the API documentation build is broken."
            exit 1
          fi

          echo "API documentation generated: $(find build/docs -type f | wc -l) files under build/docs."
