# Strict CI lane -- micro-benchmarks, kept in its own file.
#
# SPLIT OUT OF `.github/workflows/ci-strict.yml` (2026-10-08): the lane now has
# its own status-check context, so it can be retried, cancelled and reported on
# without dragging the static / coverage / mutation lanes along.
#
# The job NAME below ("CI Bench") is the status-check context -- keep it stable.

name: CI Bench

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
  workflow_dispatch:

# Least privilege: the lane reads the repository and writes nothing back.
permissions:
  contents: read

# Scope the group PER EVENT (same method as ci-strict.yml, adopted from
# zef-framework ci.yml). A run can only supersede a run of its own event
# type, so a `pull_request` run never queues behind a `push`/`workflow_dispatch`
# run for the same ref; with `cancel-in-progress` the stale run of the SAME
# event is cancelled and the new run starts immediately.
concurrency:
  group: ci-bench-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Micro-benchmark lane.
  ci-bench:
    name: CI Bench
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run benchmarks (composer ci:bench)
        run: composer ci:bench
