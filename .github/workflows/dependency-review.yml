# Dependency Review lane: fails a pull request that INTRODUCES a HIGH or
# CRITICAL advisory into the dependency graph.
#
# WHY THIS FILE EXISTS
# --------------------
# Mirrors `.github/workflows/dependency-review.yml` from the reference
# repository `zeflous/zef-framework`. `composer audit` (run inside
# `composer ci:strict`) reviews the committed lock file as a whole; this
# GitHub-native action instead diffs the dependency graph BEFORE vs AFTER the
# change, so only the advisories a pull request actually adds are reported. A
# repository that is already carrying known advisories can therefore never have
# a NEW vulnerable package slip in behind that noise.
#
# CONVENTIONS (mirrors the repository's other workflows)
# ------------------------------------------------------
#   * Every `uses:` is pinned to a FULL 40-character commit SHA with the
#     original tag kept as a trailing comment. Tag/branch refs are exactly what
#     SonarCloud flags as `githubactions:S7637`; pinning keeps the supply-chain
#     finding count at zero with no rule exclusion and no relaxed gate.
#   * Least privilege: the job only reads the dependency graph.
#   * `fail-on-severity: high` blocks HIGH/CRITICAL only — deliberately not
#     `low`/`moderate`. The dev toolchain carries a long tail of low-severity
#     advisories, and a gate that reds every routine dependency PR gets routed
#     around rather than fixed.
#   * License checks are deliberately NOT enabled: part of the dependency set
#     ships without a declared license, so a license gate would block normal PRs
#     on metadata that is not actionable here. License policy is an owner-owned
#     decision, kept separate from vulnerability review.
#
# SCOPE NOTE
# ----------
# The action is only meaningful in a pull-request context (it diffs the base
# graph against the head graph), so there is intentionally NO `workflow_dispatch`
# trigger — a manual run would have nothing to diff. `workflow_dispatch` is not
# needed to re-verify: re-running the job from the PR's Checks tab does that.

name: Dependency Review

on:
  pull_request:
    branches:
      - main

# Least privilege: read the dependency graph, write nothing.
permissions:
  contents: read

# NEVER CANCEL A RUN OF A DIFFERENT HEAD -- KEY THE GROUP PER COMMIT
# (fixed 2026-10-10, mirrors ci-strict.yml). On a `pull_request` event
# `github.ref` is the ephemeral merge ref `refs/pull/N/merge`, which MUTATES
# whenever the pull request is updated: two runs for two different heads share
# one group, and GitHub's `cancel-in-progress` is a best-effort, unordered
# cancellation -- the NEWEST run is sometimes the victim (observed on PR #136:
# the lane runs for head 92f182e0 were cancelled by a run for the older head
# 511c72c5 that entered the group one second earlier). A cancelled lane leaves
# the required check `cancelled`, the `CI Strict` aggregator polls it as
# pending for 60 minutes, times out, and the pull request is blocked even
# though nothing is wrong with its code.
#
# Keying the group on the COMMIT under verification (the pull-request head
# sha, falling back to the push sha) makes two runs for two different heads
# land in two different groups, so a new run can never be cancelled by a stale
# one: it starts immediately and reports its own check-run. `cancel-in-
# progress: false` is deliberate -- with per-commit groups the only runs that
# can share a group are duplicates of the SAME commit, and letting both run
# (rather than cancelling one) guarantees the check-run is reported (see the
# CONCURRENCY note in ci-strict.yml for the full rationale).
concurrency:
  group: dependency-review-${{ github.event_name }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  dependency-review:
    # The job NAME is a public contract: it is the status-check context a branch
    # protection rule would pin. Keep it exactly "Dependency Review".
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
