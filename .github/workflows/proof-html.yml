name: Proof HTML
on:
  push:
  workflow_dispatch:

# Least privilege: the lane only reads the repository.
permissions:
  contents: read

concurrency:
  group: proof-html-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: anishathalye/proof-html@47a787591515a207d6fc8ef13e016ac42cb877c8 # v1.1.0
        with:
          directory: ./
