# CI Strict -- the AGGREGATOR that preserves the required `CI Strict` status
# check now that the four strict lanes live in their own workflow files.
#
# BACKGROUND
# ----------
# The strict pipeline (`composer ci:strict`) is composed of four independent
# lanes: `ci:static`, `ci:coverage`, `ci:infection`, `ci:bench`. They used to be
# four JOBS of this one workflow file, which meant:
#   * a failure/cancellation in any lane entangled the others' reporting, and
#   * a retry re-ran the whole set -- including the 60-minute Infection lane --
#     just to retry a fast lane.
# Each lane now has its own workflow (`ci-static.yml`, `ci-coverage.yml`,
# `ci-infection.yml`, `ci-bench.yml`) and therefore its own status check, so it
# can be retried, cancelled and watched on its own.
#
# This file is the thin replacement that keeps the branch ruleset working: the
# required status-check context is the string `CI Strict`, so `CI Strict` must
# remain a check that FAILS whenever a lane is red and SUCCEEDS only when all
# four lanes are green.
#
# HOW IT WORKS (and why not `needs:`)
# -----------------------------------
# A job that only `needs:` other jobs is SKIPPED when a dependency fails, and a
# required status check that is `skipped` counts as SATISFIED for branch
# protection -- a red lane would silently let a PR merge. With the lanes now in
# separate workflow files a `needs:` list is not even expressible across files,
# so this job POLLS the lane status checks for the exact commit under
# verification and fails unless every one of them completed `success`.
#
# WHY THE POLL ASSIGNS THE VERDICT (not the lanes' own runs)
# ----------------------------------------------------------
# GitHub reports workflow runs -- and therefore status checks -- by the pull
# request's HEAD sha, but on a `pull_request` event the lanes are executed on the
# ephemeral merge commit `refs/pull/N/merge`. Both shas can carry same-named
# check-runs, so this job proves the relation with the compare API before it
# attributes a run to the commit it is verifying, and it only ever accepts a
# run that is IDENTICAL to, or AHEAD of, that commit. When the merge-commit run
# is what ends up reported, those events are addressed from the PR's own events
# (`refs/pull/N/merge`), so `CI Strict` still fires here and still assigns the
# verdict.
#
# CONCURRENCY -- SUPERSEDE, DO NOT QUEUE (fixed 2026-10-10)
# --------------------------------------------------------
# The aggregator used to QUEUE (`cancel-in-progress: false`). Because it polls
# the lanes for up to 65 minutes, a superseded run held the concurrency group
# open for that whole window, so the run for the NEWEST head sat `pending` with
# 0 jobs and its `CI Strict` check-run was never created -- the pull request
# stayed `blocked` even though every lane was green. This is the auto-merge
# deadlock that was observed on PR #123: run 420 (head 636e091c) queued behind
# run 419, a stale poll for the superseded head 929c2687, so the required
# `CI Strict` check never concluded for the current head and GitHub's native
# auto-merge -- which was correctly armed -- had nothing to merge on.
#
# The aggregator now SUPERSEDES a stale run of its own event type
# (`cancel-in-progress: true`), exactly like the reference repository's
# `ci.yml`. This is safe because the aggregator is a SEPARATE workflow from the
# lanes and shares no concurrency group with them, so cancelling a stale
# aggregator run never cancels a lane. The newest run therefore starts
# immediately and creates the `CI Strict` check-run for the current head.
#
# The poll deadline (60 min) is deliberately SHORTER than the job timeout
# (70 min) so the job always CONCLUDES: a stuck lane fails the aggregator
# instead of leaving the required check `pending` until the runner kills it.
#
# CONVENTIONS (unchanged)
# -----------------------
#   * Every `uses:` is pinned to a FULL 40-character commit SHA with the original
#     tag kept as a trailing comment.
#   * Least privilege: it only reads the repository and the lane runs.
#   * The job NAME "CI Strict" is the status-check context -- keep it stable.
#   * The aggregator FAILS (never skips) whenever a lane is not green.

name: CI Strict

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  # Keep the same gate visible on the default branch, so a post-merge audit of
  # `main` shows the strict pipeline result for the merged commit.
  push:
    branches:
      - main
  # Allow a manual run (e.g. to re-verify after a tooling update).
  workflow_dispatch:

# Least privilege: read the repository, the lane runs and their check-runs.
permissions:
  contents: read
  actions: read
  checks: read

# SUPERSEDE a stale run instead of QUEUEING behind it (see the CONCURRENCY note
# above). The group is scoped PER EVENT, so a run can only supersede a run of its
# own event type and a `pull_request` run never cancels a `push`/`dispatch` run.
# With `cancel-in-progress: true` the stale run of the SAME event is cancelled
# and the new run starts immediately, so its `CI Strict` check-run is created for
# the new head instead of waiting out the previous run's 60-minute poll.
concurrency:
  group: ci-strict-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Aggregator: preserves the "CI Strict" status-check context. It runs no gate
  # of its own -- it is green only when every lane above is green, so the
  # branch-protection rule keeps working unchanged.
  ci-strict:
    name: CI Strict
    runs-on: ubuntu-latest
    if: always()
    # The poll deadline below is 60 minutes; the job budget is 70 so the job
    # always concludes (fails) on a stuck lane rather than being killed while
    # the required check is still `pending`.
    timeout-minutes: 70

    steps:
      - name: Verify every strict lane succeeded
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
        run: |
          set -uo pipefail

          # LANE NAMES CONTAIN SPACES. A space-separated string fed to
          # `for name in ${required}` word-splits into "CI", "Static", "CI",
          # ... so every lookup resolved to a name that does not exist, came
          # back "absent", and the poll below spun until its deadline. A bash
          # array keeps each lane name whole.
          required=("CI Static" "CI Coverage" "CI Infection" "CI Bench")

          # --- Resolve the commit whose lane check-runs must be verified. -------
          # A `pull_request` event executes this workflow on the ephemeral merge
          # commit `refs/pull/N/merge`, but the lane runs are REPORTED by the PR
          # head sha, so that is the authoritative commit to verify. Manual
          # dispatches look the branch head up through the API.
          sha=""
          if [ "${EVENT}" = "workflow_dispatch" ]; then
            sha=$(curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/commits/${GITHUB_REF_NAME}" \
              | jq -r '.sha // empty' 2>/dev/null) || sha=""
          elif [ "${EVENT}" = "pull_request" ] && [ -n "${GITHUB_EVENT_PATH:-}" ] && [ -f "${GITHUB_EVENT_PATH}" ]; then
            sha=$(jq -r '.pull_request.head.sha // empty' "${GITHUB_EVENT_PATH}" 2>/dev/null) || sha=""
          fi
          [ -n "${sha}" ] || sha="${GITHUB_SHA}"
          echo "Verifying the strict lanes for commit ${sha} (event: ${EVENT})."

          # --- Merge-commit relation probe. ------------------------------------
          # `compare(a...b)` reports "identical" when a == b, "ahead" when b is a
          # descendant of a (so b is newer), and "behind"/"diverged" otherwise.
          # Only "identical" and "ahead" are accepted, which stops a same-named
          # check-run belonging to a DIFFERENT commit from being mistaken for a
          # lane result of the commit under verification.
          relation() { # $1=base sha  $2=head sha
            local rel
            rel=$(curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/compare/$1...$2" 2>/dev/null \
              | jq -r '.status // "unknown"') || rel="unknown"
            printf '%s' "${rel}"
          }

          # --- Resolve a lane check's canonical head sha. ----------------------
          # Returns the sha whose check-run is the lane result for `${sha}`: the
          # exact sha when GitHub reported the lane there, otherwise a descendant
          # sha (the merge commit case). Anything else is ignored.
          resolve_sha() { # $1=check name  $2=queried sha
            local name="$1" sn="$2" csr c
            csr=$(curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/commits/${sn}/check-runs?check_name=$(printf '%s' "${name}" | jq -sRr @uri)&per_page=100" 2>/dev/null) || csr=""
            if [ -z "${csr}" ]; then printf '%s' "${sn}"; return; fi
            for c in $(printf '%s' "${csr}" | jq -r --arg n "${name}" '.check_runs[] | select(.name == $n) | .head_sha'); do
              [ "${c}" = "${sn}" ] && { printf '%s' "${sn}"; return; }
              rel=$(relation "${sn}" "${c}")
              if [ "${rel}" = "ahead" ] || [ "${rel}" = "identical" ]; then
                printf '%s' "${c}"; return
              fi
            done
            printf '%s' "${sn}"
          }

          # --- Poll until every lane has a concluding run for this commit. -----
          # Bound by the slowest lane's own timeout (60 minutes for Infection)
          # plus a small grace, so a lane held open can never hang this check.
          # The deadline is SHORTER than the job timeout (70 min) so the job
          # always concludes instead of being killed while still `pending`.
          deadline=$(( $(date +%s) + 60 * 60 ))
          # A lane that never produces a run at all (e.g. its workflow was
          # disabled) must not hold the required check open for the whole
          # deadline: fail fast after a short grace (15 polls x 20s = 5 min).
          absent_streak=0
          while :; do
            pending=0
            absent=0
            report=""
            for name in "${required[@]}"; do
              lsha=$(resolve_sha "${name}" "${sha}")
              line=$(curl -fsSL \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${REPO}/commits/${lsha}/check-runs?check_name=$(printf '%s' "${name}" | jq -sRr @uri)&per_page=100" 2>/dev/null \
                | jq -r --arg n "${name}" '[.check_runs[] | select(.name == $n)] | sort_by(.id) | if length == 0 then "absent|absent" else "\(.[-1].status)|\(.[-1].conclusion)" end') || line="unknown|unknown"
              st="${line%%|*}"
              cc="${line##*|}"
              report="${report}${name}: status=${st} conclusion=${cc} (sha ${lsha})"$'\n'
              case "${st}:${cc}" in
                completed:success) : ;;
                completed:*) pending=1 ;;   # failure / cancelled / timed_out / ...
                absent:absent) pending=1; absent=1 ;;
                *) pending=1 ;;             # queued / in_progress
              esac
            done
            printf '%s' "${report}"
            if [ "${pending}" -eq 0 ]; then break; fi
            if [ "${absent}" -eq 1 ]; then
              absent_streak=$((absent_streak + 1))
            else
              absent_streak=0
            fi
            if [ "${absent_streak}" -ge 15 ]; then
              echo "::error::A strict lane never produced a run for ${sha} (absent for 5 minutes)."
              printf '%s' "${report}"
              exit 1
            fi
            if [ "$(date +%s)" -ge "${deadline}" ]; then
              echo "::error::Timed out waiting for the strict lanes to conclude."
              printf '%s' "${report}"
              exit 1
            fi
            echo "Lanes still pending; polling again in 20s..."
            sleep 20
          done

          # --- Verdict. --------------------------------------------------------
          failed=0
          for name in "${required[@]}"; do
            lsha=$(resolve_sha "${name}" "${sha}")
            cc=$(curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/commits/${lsha}/check-runs?check_name=$(printf '%s' "${name}" | jq -sRr @uri)&per_page=100" 2>/dev/null \
              | jq -r --arg n "${name}" '[.check_runs[] | select(.name == $n)] | sort_by(.id) | if length == 0 then "skipped" else .[-1].conclusion end') || cc="unknown"
            if [ "${cc}" != "success" ]; then
              echo "::error::CI Strict lane '${name}' did not succeed (conclusion: ${cc})."
              failed=1
            else
              echo "CI Strict lane '${name}' succeeded."
            fi
          done
          if [ "${failed}" -ne 0 ]; then
            echo "::error::One or more strict lanes failed; failing the CI Strict aggregator."
            exit 1
          fi
          echo "All strict lanes (static, coverage, infection, bench) passed."
