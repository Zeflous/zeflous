# Strict CI lane: runs the repository's own full-quality pipeline on every pull
# request, so the local gates (PHPStan max level, PHP-CS-Fixer, PHP_CodeSniffer +
# Slevomat, Rector, Deptrac, Infection mutation testing, PHPUnit + coverage gate,
# strict supply-chain audit, persistent-worker smoke and PHPBench) are visible on
# each PR instead of living only on a developer's machine.
#
# WHY THIS FILE EXISTS
# --------------------
# The SonarCloud lane (`.github/workflows/sonarcloud.yml`) is the cloud
# reviewer, but it only publishes what *it* computes. `composer ci:strict` is the
# repository's single source of truth for the strict pipeline, and it previously
# had no CI surface at all. This lane runs exactly that script, so a green check
# means the same set of gates the maintainers run locally.
#
# WHY THE JOBS ARE SPLIT
# ----------------------
# `composer ci:strict` is one entry point, but it is composed of four independent
# lanes (`ci:static`, `ci:coverage`, `ci:infection`, `ci:bench`). Running them in
# a single job made the whole pipeline as slow as its slowest member: Infection
# (mutation testing over the full surface) can take tens of minutes on a growing
# codebase, and it blocked every other gate behind it. Each lane now runs as its
# own job, in parallel, so a slow mutation run no longer holds the fast gates
# open. The `CI Strict` job is a thin aggregator that `needs` all four, so the
# required status-check context "CI Strict" is preserved unchanged.
#
# CONVENTIONS (mirrors `.github/workflows/sonarcloud.yml`)
# -------------------------------------------------------
#   * Every `uses:` is pinned to a FULL 40-character commit SHA with the
#     original tag kept as a trailing comment. Tag/branch refs are what
#     SonarCloud flags as `githubactions:S7637`; pinning keeps supply-chain
#     findings at zero without any rule exclusion.
#   * Least privilege: the jobs only read the repository.
#   * The job NAME "CI Strict" is the status-check context -- keep it stable
#     if it is ever added to a branch-protection rule.
#
# SCOPE NOTE
# ----------
# This lane complements, and does not replace, the SonarCloud gate. It runs the
# deterministic local pipeline; the SonarCloud lane runs the server-side quality
# gate. Both are independent signals on the same pull request.

name: CI Strict

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  # Keep the same gate visible on the default branch, so a post-merge audit of
  # `main` shows the strict pipeline result for the merged commit.
  push:
    branches:
      - main
  # Allow a manual run (e.g. to re-verify after a tooling update).
  workflow_dispatch:

# Least privilege: the pipeline reads the repository and writes nothing back.
permissions:
  contents: read

# Supersede a stale run for the same ref instead of queueing behind it.
concurrency:
  group: ci-strict-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast, deterministic static analysis + unit tests + supply-chain audit.
  ci-static:
    name: CI Static
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
          # Cache the Composer download cache so the split jobs do not each pay
          # the full dependency-download cost.
          cache: composer

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run static pipeline (composer ci:static)
        # composer validate --strict, lint, PHPStan (max level) + ratchet,
        # Deptrac, PHP-CS-Fixer check, PHP_CodeSniffer, Rector dry-run, PHPUnit,
        # the persistent-worker smoke test and the strict supply-chain audit.
        run: composer ci:static

      - name: Psalm (static analysis, level 1 + baseline)
        # Psalm runs at its strictest level (1). The pre-existing findings are
        # frozen in `psalm-baseline.xml` -- the same "no new debt" ratchet the
        # PHPStan baseline uses -- so this gate fails only on NEW issues and
        # never loosens the existing PHPStan gate.
        run: vendor/bin/psalm --no-cache --no-progress

      - name: Progpilot (static security analysis)
        # Progpilot is a taint-style security analyser. It is NOT installed via
        # Composer: `designsecurity/progpilot` v1.3.0 requires `symfony/yaml
        # ^7.3.2`, which conflicts with the `symfony/yaml ^8` this repository
        # already locks (pulled in by doctum/deptrac). The official release PHAR
        # is used instead, pinned by version AND by SHA-256 so the artifact
        # cannot be swapped. It analyses `src/` and fails on any finding.
        run: |
          curl -fsSL -o progpilot.phar \
            https://github.com/designsecurity/progpilot/releases/download/v1.3.0/progpilot_v1.3.0.phar
          echo "e95979fa4a562daffbfb66012f7fab2f4ff47692d16284337a8fc48d5247d203  progpilot.phar" | sha256sum -c -
          findings="$(php progpilot.phar --configuration=progpilot.yml src | tr -d '[:space:]')"
          if [ "$findings" != "[]" ]; then
            echo "::error::Progpilot reported security findings in src/."
            php progpilot.phar --configuration=progpilot.yml src
            exit 1
          fi
          echo "Progpilot: no security findings in src/."

      - name: PhpCodeArcheology (architecture & maintainability gate)
        # PhpCodeArcheology is the repository's non-server-side counterpart to
        # SonarCloud: it measures architecture and maintainability (60+ metrics,
        # complexity, coupling, cohesion, git churn hotspots, health score)
        # rather than type safety, so it complements PHPStan/Psalm instead of
        # duplicating them. It is installed as a Composer dev-dependency
        # (`php-code-archeology/php-code-archeology`, pinned `^2.11`).
        #
        # The MCP server it ships is intentionally NOT configured or used.
        #
        # Two steps:
        #   1. `composer archeology` writes the SARIF + Markdown reports into
        #      the git-ignored `build/archeology/` (uploaded as an artifact).
        #   2. `composer archeology:gate` normalises the SARIF paths and fails
        #      on any ERROR-level architecture finding.
        #
        # WHY NOT `--quick --fail-on=error`: `--quick` short-circuits the
        # prediction pass entirely and always exits 0, so it was a no-op gate.
        # The full run's `--fail-on=error` is also unusable as-is: it counts
        # the relative "effort/MI/LCOM more than 30% above/below average"
        # findings as errors, and those are a distribution artefact (any
        # codebase has entities above 1.3x the mean by construction), not
        # defects. The gate therefore reads the SARIF `level` field, which is
        # `error` only for genuine architecture defects (GodClass,
        # SecuritySmell, DependencyCycle, "Difficulty is too high").
        #
        # WHY NOT A COMMITTED BASELINE: the tool's problem identity is
        # `crc32(<absolute path>)`, so a baseline file is not portable between
        # the developer's checkout and the CI runner (different absolute
        # paths) -- it would report spurious "new problems" on every run. The
        # gate is therefore deterministic and depends only on the source tree.
        run: |
          composer archeology
          composer archeology:gate

      - name: Upload PhpCodeArcheology reports
        # The SARIF report is also consumable by GitHub Code Scanning; the
        # Markdown report is the human-readable summary. Both are uploaded as
        # a build artifact so the metrics are visible on every run.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: phpcodearcheology-report
          path: build/archeology/
          if-no-files-found: ignore
          retention-days: 14

  # Line-coverage gate (needs pcov).
  ci-coverage:
    name: CI Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup PHP 8.4 with pcov
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: pcov
          coverage: pcov
          tools: composer:v2
          cache: composer

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run coverage gate (composer ci:coverage)
        run: composer ci:coverage

  # Mutation testing -- the heaviest lane, isolated so it cannot block the rest.
  ci-infection:
    name: CI Infection
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup PHP 8.4 with pcov
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: pcov
          coverage: pcov
          tools: composer:v2
          cache: composer

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run mutation testing (composer ci:infection)
        # Infection (MSI 100) plus the mutation-score floor.
        run: composer ci:infection

  # Micro-benchmark lane.
  ci-bench:
    name: CI Bench
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
          cache: composer

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run benchmarks (composer ci:bench)
        run: composer ci:bench

  # Aggregator: preserves the "CI Strict" status-check context. It runs no gate
  # of its own -- it is green only when every lane above is green, so the
  # branch-protection rule keeps working unchanged.
  ci-strict:
    name: CI Strict
    runs-on: ubuntu-latest
    needs:
      - ci-static
      - ci-coverage
      - ci-infection
      - ci-bench
    steps:
      - name: All strict lanes passed
        run: echo "All strict lanes (static, coverage, infection, bench) passed."
