# CI Strict -- the AGGREGATOR that preserves the required `CI Strict` status
# check now that the four strict lanes live in their own workflow files.
#
# BACKGROUND
# ----------
# The strict pipeline (`composer ci:strict`) is composed of four independent
# lanes: `ci:static`, `ci:coverage`, `ci:infection`, `ci:bench`. They used to be
# four JOBS of this one workflow file, which meant:
#   * a failure/cancellation in any lane entangled the others' reporting, and
#   * a retry re-ran the whole set -- including the 60-minute Infection lane --
#     just to retry a fast lane.
# Each lane now has its own workflow (`ci-static.yml`, `ci-coverage.yml`,
# `ci-infection.yml`, `ci-bench.yml`) and therefore its own status check, so it
# can be retried, cancelled and watched on its own.
#
# This file is the thin replacement that keeps the branch ruleset working: the
# required status-check context is the string `CI Strict`, so `CI Strict` must
# remain a check that FAILS whenever a lane is red and SUCCEEDS only when all
# four lanes are green.
#
# ARCHITECTURE -- EVENT-DRIVEN FIRST, BOUNDED FALLBACK SECOND (2026-10-11)
# -----------------------------------------------------------------------
# The previous revision POLLED the four lane check-runs in a long `run:` step
# (up to 60 minutes, `sleep 20` between sweeps). That design had three defects:
#   1. It kept a runner "idle" for up to an hour per run, and when many pull
#      requests were stacked the concurrent polls hammered the REST API and
#      risked the rate limit -- the LAST pull request in the stack was the one
#      that suffered.
#   2. Its verdict was gated on a merge-commit IDENTITY probe: it only accepted
#      a lane run whose head sha was IDENTICAL to, or AHEAD of, the commit under
#      verification. A lane that had genuinely completed `success` on the real
#      head could still be rejected purely because the sha it was reported
#      against differed from the one the aggregator expected -- a false red.
#   3. It was a `pull_request`-only workflow, so it could not react to a lane
#      finishing; it could only wait.
#
# This revision makes the aggregator EVENT-DRIVEN. It is triggered by
# `workflow_run` the moment any of the four lanes COMPLETES, so it reacts
# instead of waiting, and on that path it runs NO polling loop at all: the lane
# that just completed is the last one, so a single aggregation pass is enough.
# The LAST lane to complete therefore drives the definitive verdict.
#
# MERGE-GROUP HEADS ARE EXCLUDED FROM THE EVENT-DRIVEN PATH (2026-10-19)
# -------------------------------------------------------------------
# The `workflow_run` trigger below carries `branches-ignore:
# 'gh-readonly-queue/**'`: a lane run on a merge group reports its completion
# with the queue ref as its head branch, and an event-driven aggregator firing
# there used to write the required `CI Strict` check-run on the GROUP HEAD
# from outside the `merge_group` path. Measured on the 2026-10-19 storm
# (docs/ci-notes/merge-queue-render-storm.md): every such write landed 40-60
# seconds after a fast lane completed and correlated 1:1 with the queue
# re-synthesising the group (02:07:52->02:08:38, 02:11:04->02:11:55,
# 02:14:16->02:15:15), superseding every in-flight lane run. The storm period
# (~3 minutes at its peak) sat far below the certification time (~10 minutes,
# CI Infection), so the group could NEVER certify -- the queue appeared
# blocked for hours while every individual run read green (superseded runs
# keep their success conclusion). The `merge_group` polling run is now the
# SOLE writer of a group head's verdict: it writes exactly once, the final
# conclusion, well inside the ruleset's 90-minute check-response timeout.
# Pull-request and push heads keep the event-driven fast path unchanged.
#
# MERGE QUEUE (2026-10-18, finding 3 of the merge-gate audit)
# ------------------------------------------------------------
# The `main` ruleset's merge queue validates pull requests on temporary
# `gh-readonly-queue/main/pr-N-...` refs, running the required checks from the
# DEFAULT BRANCH's workflow files -- the queue, not the pull request, supplies
# the workflow version, which is what kills the PR-version spoof class
# (docs/ci-notes/merge-gate-audit.md, finding 3). This aggregator therefore
# also runs on `merge_group` and reports `CI Strict` on the merge group's head
# sha. That path deliberately uses the BOUNDED-POLLING machinery of the
# fallback path below: `workflow_run` firing from a `gh-readonly-queue` ref is
# not a documented guarantee, so the queue-path verdict must not depend on it --
# the lanes carry their own `merge_group` triggers, their check-runs land on the
# group head sha, and the poller below resolves them within the same 70-minute
# deadline (with the same visible `timed_out` expiry) it gives a pull request.
#
# WHY A BOUNDED FALLBACK STILL EXISTS
# -----------------------------------
# `workflow_run` only fires for a workflow file that exists on the DEFAULT
# branch. The very pull request that introduces this file therefore cannot be
# driven by `workflow_run` -- the default branch still carries the previous
# revision. The `pull_request` trigger is kept for exactly that bootstrap case
# (and as a safety net if a `workflow_run` event is ever dropped): on that path
# the job waits for the lanes with a BOUNDED loop whose sleep is 60 seconds
# (raised from 20s, which cuts the API request rate by two thirds and removes
# the rate-limit pressure on stacked pull requests) and whose deadline sits
# ABOVE the slowest lane's own timeout (70 minutes vs ci-infection.yml's 60)
# so a lane that merely runs long is still awaited. Expiry now CONCLUDES the
# check-run `timed_out` instead of leaving it `in_progress` forever -- an
# eternal pending is fail-closed but fail-SILENT (a blocked pull request with
# no red check to act on); see docs/ci-notes/merge-gate-audit.md, finding 4.
#
# WHY THE VERDICT IS KEYED TO THE ACTUAL HEAD SHA (not a merge-commit identity)
# -----------------------------------------------------------------------------
# GitHub reports workflow runs -- and therefore status checks -- by the pull
# request's HEAD sha, but on a `pull_request` event the lanes are executed on the
# ephemeral merge commit `refs/pull/N/merge`. The old design tried to prove the
# relation between the two with the compare API and rejected anything that was
# not IDENTICAL/AHEAD. That is exactly the over-strict comparison that produced
# false reds. This revision instead resolves the ONE commit that matters -- the
# pull request's head sha -- and reads the lane check-runs that GitHub itself
# reports for that commit. A lane that is `completed`/`success` for the head sha
# is accepted as green regardless of which internal ref produced it; the verdict
# never fails merely because a sha differs from an expected one.
#
# WHY THE CHECK-RUN IS CREATED EXPLICITLY (and not left to the job's own run)
# ---------------------------------------------------------------------------
# A `workflow_run`-triggered run executes in the context of the DEFAULT BRANCH,
# so its own job check-run lands on the default-branch head -- NOT on the pull
# request's head sha. A required check that never appears on the head sha would
# leave the pull request permanently `blocked`. This workflow therefore does not
# rely on its own job check-run: it creates (or updates) a check-run NAMED
# `CI Strict` on the resolved head sha through the Checks API, using the
# in-workflow `GITHUB_TOKEN` (the Actions app, id 15368 -- the same integration
# the ruleset requires). The job itself is named `CI Strict Aggregator` so it
# never collides with the required context.
#
# CONCURRENCY -- SUPERSEDE, DO NOT QUEUE
# --------------------------------------
# The group is keyed on the COMMIT under verification, not on the branch. Two
# different commits are therefore in two different groups, so a new run never
# queues behind a stale one and its check-run is always created. `cancel-in-
# progress: false` is deliberate: with per-commit groups the only runs that can
# share a group are duplicates of the SAME commit, and letting both run (rather
# than cancelling one) guarantees the check-run is reported. The group string
# contains `github.event.pull_request.head.sha` and `github.sha` so the
# repository's workflow-concurrency gate recognises it as commit-keyed.
#
# CONVENTIONS (unchanged)
# -----------------------
#   * Every `uses:` is pinned to a FULL 40-character commit SHA with the original
#     tag kept as a trailing comment.
#   * Least privilege: it reads the repository and the lane runs, and it writes
#     the single `CI Strict` check-run (`checks: write`). Nothing else.
#   * The job NAME is `CI Strict Aggregator`; the required status-check context
#     `CI Strict` is the check-run this workflow creates.
#   * The aggregator FAILS (never skips) whenever a lane is not green.

name: CI Strict

on:
  # EVENT-DRIVEN PRIMARY: fire the moment any strict lane completes. On this
  # path the aggregator runs a single pass -- no polling loop. MERGE-GROUP
  # lane completions are EXCLUDED on purpose: their head branch IS the queue
  # ref (`gh-readonly-queue/...`), and an event-driven write on a group head
  # is the re-render trigger of the 2026-10-19 storm (see the MERGE-GROUP
  # HEADS note in the header). The `merge_group` trigger below owns those
  # heads. The in-script guard double-checks the branch, so a filter that
  # fails to match cannot reintroduce the storm.
  workflow_run:
    workflows:
      - "CI Static"
      - "CI Coverage"
      - "CI Infection"
      - "CI Bench"
    types: [completed]
    branches-ignore:
      - 'gh-readonly-queue/**'
  # Register the required `CI Strict` check on the pull request the moment it
  # opens (as `in_progress`), so the required context is visible immediately and
  # the pull request is correctly `blocked` until the lanes finish. This is also
  # the BOOTSTRAP path for the pull request that introduces this file (see the
  # header): `workflow_run` cannot fire until the file is on the default branch.
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  # MERGE QUEUE: validate the merge group the queue assembled (see the MERGE
  # QUEUE note in the header). On this event `github.sha` is the merge group's
  # head sha, so the polling path below tracks exactly the lanes the queue is
  # waiting for, and the `CI Strict` check-run lands on the group ref.
  merge_group:
    branches:
      - main
  # Keep the same gate visible on the default branch, so a post-merge audit of
  # `main` shows the strict pipeline result for the merged commit.
  push:
    branches:
      - main
  # Allow a manual run (e.g. to re-verify after a tooling update).
  workflow_dispatch:

# Least privilege: read the repository and the lane runs; `checks: write` is
# needed only to create/update the single `CI Strict` check-run.
permissions:
  contents: read
  actions: read
  checks: write

# NEVER QUEUE BEHIND A STALE RUN -- KEY THE GROUP PER COMMIT
# ----------------------------------------------------------
# The group is keyed on the COMMIT under verification. For a `workflow_run`
# firing that is the lane run's head sha; for a `pull_request` event it is the
# pull request head sha; for `push`/`workflow_dispatch` it is the pushed sha;
# for a `merge_group` event it is the merge group's head sha.
# Two different commits land in two different groups, so a new run never queues
# behind a stale one and its check-run is always created.
concurrency:
  group: ci-strict-${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  # Aggregator: preserves the "CI Strict" status-check context. It runs no gate
  # of its own -- it is green only when every lane is green, so the
  # branch-protection rule keeps working unchanged.
  ci-strict:
    name: CI Strict Aggregator
    runs-on: ubuntu-latest
    # The `workflow_run` path is a single pass (seconds). The bounded fallback
    # path waits for the lanes; its deadline (70 min) sits ABOVE the slowest
    # lane's own timeout (ci-infection.yml: 60 min) so a lane that merely runs
    # long is still awaited, and the job budget (75 min) is above the deadline,
    # so the job always CONCLUDES (red) on a stuck lane instead of being killed
    # while the required check is still pending.
    timeout-minutes: 75

    steps:
      - name: Aggregate the strict lanes into the required `CI Strict` check
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          # `checks: write` (declared above) lets the in-workflow GITHUB_TOKEN
          # create/update the check-run; `actions: read` lets it read the lane
          # runs. The token is referenced by NAME only; its value is never
          # written to a file or log.
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Wrapped in an async IIFE so the body is a self-contained unit and
            // stays verifiable with `node --check` (github-script already runs
            // the script inside an async context).
            await (async () => {
            const LANES = ["CI Static", "CI Coverage", "CI Infection", "CI Bench"];
            const CHECK_NAME = "CI Strict";
            const { owner, repo } = context.repo;

            // --- Resolve the commit under verification. ---------------------
            // A `workflow_run` firing carries the lane run's head sha (the pull
            // request head sha for a PR-triggered lane, the pushed sha for a
            // push-triggered lane). A `pull_request` event carries the PR head
            // sha. `push`/`workflow_dispatch` fall back to the pushed sha; a
            // `merge_group` event falls back to the merge group's head sha
            // (github.sha), which is exactly the commit the queue validates.
            const wr = context.payload.workflow_run;
            const pr = context.payload.pull_request;
            const sha = (wr && wr.head_sha) || (pr && pr.head && pr.head.sha) || context.sha;
            if (!sha) {
              core.setFailed("Could not resolve the commit under verification.");
              return;
            }

            // --- Merge-queue heads: the polling path owns the verdict. ------
            // The `workflow_run` trigger excludes `gh-readonly-queue/**`, so
            // an event-driven firing for a group head should never happen;
            // this guard is the fail-safe for a filter that fails to match
            // (a glob semantics change, a dropped filter attribute). Writing
            // a group head's check-run from OUTSIDE the `merge_group` path is
            // the re-render trigger of the 2026-10-19 storm: a fast lane
            // completes, this path writes the check-run while CI Infection is
            // still running, and the queue re-synthesises the group,
            // superseding every in-flight lane run. Fail closed: log and exit
            // WITHOUT a write -- the `merge_group` polling run resolves the
            // same head within its own deadline and writes the final verdict
            // exactly once (docs/ci-notes/merge-queue-render-storm.md).
            if (wr && typeof wr.head_branch === "string" && wr.head_branch.startsWith("gh-readonly-queue/")) {
              core.info(
                `Lane completed on the merge-group head ${wr.head_branch}; the merge_group polling path owns its verdict -- no check-run write from the event-driven path.`,
              );
              return;
            }

            // --- Fork pull requests: this context cannot write the check. ----
            // GitHub downgrades the in-workflow GITHUB_TOKEN to read-only for
            // a `pull_request` event whose head is from a fork, so every
            // check-run write from this bootstrap context would 403 -- the
            // bare permission error the 2026-10-22 audit found leaving fork
            // pull requests unmergeable with all lanes green and no signal
            // but an opaque API failure. The explicit policy: a fork head
            // cannot produce the required `CI Strict` context from its own
            // bootstrap run; fail loudly with the policy named, so the
            // contributor and the maintainer both see the two ways out (the
            // maintainer re-pushes the branch into the base repository -- the
            // lanes then bootstrap the context themselves -- or verifies the
            // lanes manually). Never `pull_request_target`: it would hand the
            // fork's code a secret-bearing token (the escalation the
            // auto-merge lane's own audit already neutralised).
            const fromAForkPullRequest =
              pr && pr.head && pr.head.repo && pr.head.repo.full_name
              && pr.head.repo.full_name !== `${owner}/${repo}`;
            if (fromAForkPullRequest) {
              core.setFailed(
                "This pull request's head lives in a fork, and GitHub withholds the check-run write permission from that context: the required `CI Strict` check cannot be created here. "
                + "A maintainer can push the branch into the base repository (the lanes bootstrap the check themselves) or verify the lanes manually.",
              );
              return;
            }

            // --- Read the four lane check-runs for that commit. -------------
            // GitHub reports the lane check-runs against the head sha, so this
            // is the authoritative source. We take the LATEST check-run per
            // lane name (a re-run supersedes an earlier attempt). A lane that
            // is `completed`/`success` for the head sha is accepted as green
            // regardless of which internal ref produced it -- the verdict never
            // fails merely because a sha differs from an expected one.
            async function aggregate() {
              const runs = await github.paginate(
                github.rest.checks.listForRef,
                { owner, repo, ref: sha, per_page: 100 },
              );
              const latest = new Map();
              for (const run of runs) {
                if (!LANES.includes(run.name)) continue;
                const prev = latest.get(run.name);
                if (!prev || run.id > prev.id) latest.set(run.name, run);
              }

              // Fail-closed: a lane is green only when it is `completed` AND
              // `success`. A missing lane, or one still queued/in-progress,
              // keeps the required check `in_progress` (pending) -- never
              // green. A lane that concluded anything other than success
              // (failure, cancelled, timed_out, action_required, ...) is a hard
              // failure.
              let allDone = true;
              let anyFailed = false;
              const lines = [];
              for (const name of LANES) {
                const run = latest.get(name);
                if (!run) {
                  allDone = false;
                  lines.push(`- ${name}: **absent** (no check-run for ${sha.slice(0, 8)})`);
                  continue;
                }
                if (run.status !== "completed") {
                  allDone = false;
                  lines.push(`- ${name}: ${run.status}`);
                  continue;
                }
                if (run.conclusion !== "success") {
                  anyFailed = true;
                  lines.push(`- ${name}: **${run.conclusion}**`);
                  continue;
                }
                lines.push(`- ${name}: success`);
              }
              return { allDone, anyFailed, lines };
            }

            // --- Wait for the lanes, bounded. -------------------------------
            // On the `workflow_run` path the lane that just completed is the
            // last one, so a single pass suffices -- NO polling. On the
            // bootstrap/fallback path (`pull_request`/`push`/`workflow_dispatch`)
            // -- and on the MERGE QUEUE path (`merge_group`, which cannot rely
            // on `workflow_run` firing from a `gh-readonly-queue` ref) -- we
            // wait with a BOUNDED loop: sleep 60s (raised from 20s, cutting
            // the API request rate by two thirds) and a 70-minute deadline that
            // sits ABOVE the slowest lane's own timeout (ci-infection.yml: 60
            // minutes), so a lane that merely runs long is still awaited. When
            // the deadline expires with lanes still unresolved, the verdict
            // CONCLUDES `timed_out` (below) -- an eternal `in_progress` is
            // fail-closed but fail-silent, and no later event is guaranteed to
            // re-aggregate this head (a dropped `workflow_run` has no retry).
            const isEventDriven = context.eventName === "workflow_run";
            const deadline = Date.now() + 70 * 60 * 1000;
            let state = await aggregate();
            let expired = false;
            if (!isEventDriven) {
              while (!state.allDone && !state.anyFailed && Date.now() < deadline) {
                core.info("Lanes still pending; re-checking in 60s...");
                await new Promise((resolve) => setTimeout(resolve, 60000));
                state = await aggregate();
              }
              expired = !state.allDone && !state.anyFailed;
            }

            // On the event-driven path a pass with lanes still pending is NORMAL
            // (each lane completion re-fires this workflow), so the check stays
            // `in_progress` there by design. On the fallback path, expiry means
            // no verdict will EVER arrive on its own: conclude `timed_out` -- a
            // visible, red, actionable verdict (re-run this workflow or the lane
            // it names) instead of an eternal pending that blocks the pull
            // request with no signal to act on.
            const conclusion = state.anyFailed
              ? "failure"
              : state.allDone
                ? "success"
                : expired
                  ? "timed_out"
                  : null;
            const status = conclusion ? "completed" : "in_progress";
            const summary = [
              `Aggregated strict lanes for \`${sha}\` (event: \`${context.eventName}\`).`,
              "",
              ...state.lines,
              "",
              conclusion === "success"
                ? `**Verdict: ${conclusion}**`
                : conclusion === "timed_out"
                  ? "**Verdict: timed_out** -- the fallback wait expired with lanes still unresolved; no lane was red, but no later event is guaranteed to re-aggregate this head. Re-run this workflow, or the lane reported as non-completed above."
                  : conclusion
                    ? `**Verdict: ${conclusion}**`
                    : "**Verdict: pending** -- waiting for the remaining lanes.",
            ].join("\n");

            // --- Create or update the required `CI Strict` check-run. -------
            // Reuse the existing check-run for this commit when present, so the
            // required context is a single, stable check that flips from
            // `in_progress` to its final conclusion.
            const existing = await github.paginate(
              github.rest.checks.listForRef,
              { owner, repo, ref: sha, check_name: CHECK_NAME, per_page: 100 },
            );
            const mine = existing
              .filter((c) => c.app && c.app.id === 15368)
              .sort((a, b) => b.id - a.id)[0];

            // A COMPLETED verdict is never RE-OPENED, but it can still be
            // REFRESHED. `completed -> in_progress` is the storm's regression
            // shape (a late pass with lanes still pending flipping a concluded
            // head back open -- the merge queue reads that as fresh check
            // activity on a group head), so a pending-only pass against a
            // concluded check-run is logged and dropped: the lanes it is
            // waiting for will re-fire this workflow when THEY conclude. A
            // pass carrying a DEFINITE conclusion (success/failure/timed_out)
            // still updates the check-run: a re-run lane that went red must be
            // able to turn the recorded verdict red (fail-closed), and a
            // fixed re-run must be able to turn it green again -- verdicts
            // follow the lane check-runs, which are the source of truth.
            if (mine && mine.status === "completed" && !conclusion) {
              core.info(
                `CI Strict check-run ${mine.id} on ${sha.slice(0, 8)} is already completed (${mine.conclusion}); a still-pending aggregation pass never re-opens a concluded verdict.`,
              );
              core.info(summary);
              return;
            }

            const output = { title: CHECK_NAME, summary };
            if (mine) {
              await github.rest.checks.update({
                owner,
                repo,
                check_run_id: mine.id,
                status,
                conclusion: conclusion || undefined,
                output,
              });
            } else {
              await github.rest.checks.create({
                owner,
                repo,
                name: CHECK_NAME,
                head_sha: sha,
                status,
                conclusion: conclusion || undefined,
                output,
              });
            }

            core.info(summary);

            // Fail the job itself when a lane is red or the fallback timed out,
            // so the run is visibly red in the Actions tab as well as on the
            // check-run -- BUT only when this run's own head is the head the
            // verdict was written for. On the `workflow_run` path GitHub
            // records this job's check-run against the DEFAULT BRANCH's tip
            // (`context.sha`), while the verdict itself lands on the
            // aggregated head (`wr.head_sha` -- the pull request whose lane
            // completed). When those differ -- another pull request's lane
            // went red and this pass correctly wrote the red `CI Strict`
            // verdict on THAT pull request's head -- a red job-level exit
            // would misreport `main` itself (observed 2026-10-23: a red
            // "CI Strict Aggregator" on main's landing commit while it
            // aggregated an unrelated pull request's failed CI Static; the
            // context is required through the classic branch-protection
            // layer, so the misreport is not merely cosmetic). The verdict
            // is already recorded exactly where it belongs; the job exits
            // green on purpose, with a notice naming both heads.
            const verdictForAnotherHead =
              context.eventName === "workflow_run" && sha !== context.sha;
            if (state.anyFailed || expired) {
              if (verdictForAnotherHead) {
                core.notice(
                  `Strict lanes failed for ${sha.slice(0, 8)}, and the red CI Strict check-run was written on that head. This job's own check-run records against ${context.sha.slice(0, 8)} (the default branch tip for a workflow_run firing), where a red exit would misreport main -- exiting green on purpose.`,
                );
              } else {
                core.setFailed(
                  expired
                    ? "The fallback wait expired with strict lanes still unresolved; the CI Strict check is timed_out (red), not pending."
                    : "One or more strict lanes failed; the CI Strict check is red.",
                );
              }
            }
            })();
